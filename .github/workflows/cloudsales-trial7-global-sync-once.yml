name: CloudSales Trial 7 Global Sync Once
on:
  push:
    paths:
      - '.github/workflows/cloudsales-trial7-global-sync-once.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch exact CloudSales trial copy
        shell: python
        run: |
          from pathlib import Path
          targets = [
            Path('web/subscribe.html'), Path('web/welcome.html'), Path('web/install.js'),
            Path('web/auth-runtime-v2.js'), Path('web/terms.html'), Path('web/pwa.html'),
            Path('web/commercial.html'), Path('web/commercial/conversion-v1.js'),
            Path('ops/highlevel-marketplace-state.json'), Path('docs/highlevel-marketplace/CLOUDSALES_MARKETPLACE_LISTING.md')
          ]
          reps = {
            '14 días de prueba gratis':'7 días de prueba gratis',
            '14 días gratis':'7 días gratis',
            '14-day free trial':'7-day free trial',
            '14 days free':'7 days free',
            '14 jours gratuits':'7 jours gratuits',
            '14 giorni gratis':'7 giorni gratis',
            '14 Tage kostenlos':'7 Tage kostenlos',
            '14 يوماً مجاناً':'7 أيام مجاناً',
            '14 дней бесплатно':'7 дней бесплатно',
            '14 ימים חינם':'7 ימים חינם',
            '14 天免费试用':'7 天免费试用',
            '免费试用 14 天':'免费试用 7 天',
            '14日間の無料トライアル':'7日間の無料トライアル',
            '14日間無料':'7日間無料',
            '14-day':'7-day',
            '14 days':'7 days',
            '14 días':'7 días',
            '14 jours':'7 jours',
            '14 giorni':'7 giorni',
            '14 Tage':'7 Tage',
            '14 يوماً':'7 أيام',
            '14 дней':'7 дней',
            '14 ימים':'7 ימים',
            '14 天':'7 天',
            '14日間':'7日間',
            '"trial_days": 14':'"trial_days": 7',
            '"trial_days":14':'"trial_days":7',
            "trial_days: 14":"trial_days: 7",
            "trial_days:14":"trial_days:7"
          }
          changed=[]
          for p in targets:
            if not p.exists(): continue
            s=p.read_text(encoding='utf-8')
            n=s
            for a,b in reps.items(): n=n.replace(a,b)
            if n!=s:
              p.write_text(n,encoding='utf-8')
              changed.append(str(p))
          print('changed:', *changed, sep='\n- ')
          # Guard live customer-facing files.
          for p in [Path('web/subscribe.html'),Path('web/welcome.html'),Path('web/install.js'),Path('web/auth-runtime-v2.js'),Path('web/terms.html')]:
            if p.exists():
              s=p.read_text(encoding='utf-8').lower()
              bad=[x for x in ['14 días','14-day','14 days','14 jours','14 giorni','14 tage','14 дней','14 ימים','14 天','14日間'] if x in s]
              if bad: raise SystemExit(f'stale trial copy in {p}: {bad}')
      - name: Commit global trial policy
        run: |
          git config user.name 'CloudSales Release Bot'
          git config user.email 'info@cloudsales.app'
          git add web/subscribe.html web/welcome.html web/install.js web/auth-runtime-v2.js web/terms.html web/pwa.html web/commercial.html web/commercial/conversion-v1.js ops/highlevel-marketplace-state.json docs/highlevel-marketplace/CLOUDSALES_MARKETPLACE_LISTING.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Set CloudSales trial to 7 days globally'
          git push

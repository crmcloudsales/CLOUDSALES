name: Patch Email Engine Runtime

on:
  push:
    paths:
      - '.github/workflows/patch-email-engine-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch CloudSales email runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/cloudflare-control/index.ts')
          s = p.read_text()

          old = '''async function secret(k:string){if(!k)return null;const e=Deno.env.get(k);if(e?.trim())return e.trim();const{data}=await db.rpc("email_engine_read_secret",{p_setting_key:k});return typeof data==="string"&&data.trim()?data.trim():null}'''
          new = '''async function secret(k:string){if(!k)return null;if(k==="cloudflare_email_sending_token"){const{data}=await db.rpc("email_engine_read_secret",{p_setting_key:k});if(typeof data==="string"&&data.trim())return data.trim()}const e=Deno.env.get(k);if(e?.trim())return e.trim();const{data}=await db.rpc("email_engine_read_secret",{p_setting_key:k});return typeof data==="string"&&data.trim()?data.trim():null}'''
          if old not in s:
              raise SystemExit('secret anchor missing')
          s = s.replace(old, new, 1)

          old = 'const domain=await secret("MAILGUN_DOMAIN_CLOUDSALES");let base='
          new = 'const domain=String((await setting("mailgun_runtime_domain_cloudsales"))?.domain||await secret("MAILGUN_DOMAIN_CLOUDSALES")||"");let base='
          if old not in s:
              raise SystemExit('mailgun send anchor missing')
          s = s.replace(old, new, 1)

          old = 'const k=await secret("MAILGUN_API_KEY_CLOUDSALES"),domain=await secret("MAILGUN_DOMAIN_CLOUDSALES");let base='
          new = 'const k=await secret("MAILGUN_API_KEY_CLOUDSALES"),domain=String((await setting("mailgun_runtime_domain_cloudsales"))?.domain||await secret("MAILGUN_DOMAIN_CLOUDSALES")||"");let base='
          if old not in s:
              raise SystemExit('mailgun health anchor missing')
          s = s.replace(old, new, 1)

          start = '  try{const k=await secret("cloudflare_email_sending_token"),z=await setting("cloudflare_cloudsales_zone")'
          end = '  }catch(e){report.cloudflare={ok:false,error:String((e as Error).message||e).slice(0,240)}}'
          a = s.find(start)
          b = s.find(end, a)
          if a < 0 or b < 0:
              raise SystemExit('cloudflare health anchors missing')
          replacement = '''  try{const k=await secret("cloudflare_email_sending_token"),a=await setting("cloudflare_cloudsales_account"),account=String(a?.account_id||""),growth=await setting("cloudsales_email_growth_routing_policy"),paid=Boolean(growth?.paid_mode_unlocked);if(!k||!account)throw Error("cloudflare_email_sending_token_or_account_missing");const [tr,sr]=await Promise.all([fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/tokens/verify`,{headers:{Authorization:`Bearer ${k}`,Accept:"application/json"}}),fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/email/sending/suppressions?per_page=1`,{headers:{Authorization:`Bearer ${k}`,Accept:"application/json"}})]),tt=await tr.text(),st=await sr.text();let tj:any={},sj:any={};try{tj=JSON.parse(tt)}catch{}try{sj=JSON.parse(st)}catch{}const healthy=tr.ok&&tj?.success!==false&&String(tj?.result?.status||"").toLowerCase()==="active"&&sr.ok&&sj?.success!==false,active=healthy&&paid;report.cloudflare={ok:healthy,account_token_active:tr.ok,email_sending_permission_verified:sr.ok,paid_mode_unlocked:paid,production_ready:active};const{data:g}=await db.from("email_engine_providers").select("config").eq("provider_key","cloudflare_email_service").maybeSingle();const common={health_status:healthy?"healthy_send_verified":"unhealthy",account_token_active:tr.ok,email_sending_permission_verified:sr.ok,send_api_verified:true,domain_onboarded:true,ready_for_activation:healthy,paid_mode_unlocked:paid};await db.from("email_engine_providers").update({status:active?"active":"inactive",config:{...(g?.config||{}),...common},last_health_at:now,updated_at:now}).eq("provider_key","cloudflare_email_service");const{data:bb}=await db.from("email_engine_brand_providers").select("config").eq("brand_key","cloudsales").eq("provider_key","cloudflare_email_service").maybeSingle();await db.from("email_engine_brand_providers").update({status:active?"active":"inactive",config:{...(bb?.config||{}),...common},last_health_at:now,updated_at:now}).eq("brand_key","cloudsales").eq("provider_key","cloudflare_email_service")
'''
          s = s[:a] + replacement + end + s[b+len(end):]
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "CloudSales Automation"
          git config user.email "noreply@cloudsales.app"
          git add supabase/functions/cloudflare-control/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Fix Cloudflare and Mailgun email runtime"
          git push

name: PWA Executive Sync Once

on:
  push:
    paths:
      - '.github/workflows/pwa-executive-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align canonical PWA release and service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/cloudflare-pwa-brand-release/index.ts')
          s=p.read_text()
          s=s.replace('const VERSION="2026.09.01.3";','const VERSION="2026.09.01.4";')
          marker='  "/workspace-polish-runtime-v1.js",\n];'
          insert='  "/workspace-polish-runtime-v1.js",\n  "/pwa-i18n-runtime-v1.js",\n  "/cloudy-executive-runtime-v1.js",\n];'
          if marker in s:
              s=s.replace(marker,insert,1)
          for g in ['const VERSION="2026.09.01.4";','"/pwa-i18n-runtime-v1.js"','"/cloudy-executive-runtime-v1.js"']:
              if g not in s: raise SystemExit('missing release guard '+g)
          p.write_text(s)

          sw=Path('web/sw.js')
          w=sw.read_text()
          w=w.replace("const CACHE='cloudsales-pwa-2026.09.01.1';","const CACHE='cloudsales-pwa-2026.09.01.2';")
          marker="  '/workspace-polish-runtime-v1.js',\n"
          insert="  '/workspace-polish-runtime-v1.js',\n  '/pwa-i18n-runtime-v1.js',\n  '/cloudy-executive-runtime-v1.js',\n"
          if "'/pwa-i18n-runtime-v1.js'" not in w:
              if marker not in w: raise SystemExit('sw marker missing')
              w=w.replace(marker,insert,1)
          for g in ["cloudsales-pwa-2026.09.01.2","'/pwa-i18n-runtime-v1.js'","'/cloudy-executive-runtime-v1.js'"]:
              if g not in w: raise SystemExit('missing sw guard '+g)
          sw.write_text(w)
          PY
      - name: Validate runtimes and guards
        run: |
          node --check web/pwa-i18n-runtime-v1.js
          node --check web/cloudy-executive-runtime-v1.js
          node --check web/sw.js
          grep -q 'VERSION="2026.09.01.4"' supabase/functions/cloudflare-pwa-brand-release/index.ts
          grep -q 'pwa-i18n-runtime-v1.js' supabase/functions/cloudflare-pwa-brand-release/index.ts
          grep -q 'cloudy-executive-runtime-v1.js' supabase/functions/cloudflare-pwa-brand-release/index.ts
          grep -q 'cloudsales-pwa-2026.09.01.2' web/sw.js
      - name: Commit canonical alignment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add supabase/functions/cloudflare-pwa-brand-release/index.ts web/sw.js
          git commit -m "feat(pwa): ship Cloudy executive center and multilingual runtime"
          git push origin HEAD:main

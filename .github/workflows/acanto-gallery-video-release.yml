name: ACANTO Gallery + Video Source Release

on:
  push:
    paths:
      - '.ops/acanto-gallery-video-release.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: acanto-gallery-video-release
  cancel-in-progress: false

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch ACANTO landing
        run: python .github/scripts/patch_acanto_gallery_videos.py

      - name: Verify release contract
        shell: bash
        run: |
          set -euo pipefail
          FILE='web/clients/acanto/landing-v2.html'
          grep -q 'id="gallery"' "$FILE"
          grep -q 'id="videos"' "$FILE"
          grep -q 'acanto-condominiums-cloudsales-v7-gallery-video' "$FILE"
          ! grep -q 'id="inventory"' "$FILE"
          ! grep -q 'href="#inventory"' "$FILE"
          ! grep -q 'Villa 1 — 1BR — US$199,000' "$FILE"
          test "$(grep -o 'class="gItem"' "$FILE" | wc -l | tr -d ' ')" = '9'

      - name: Commit canonical ACANTO source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/clients/acanto/landing-v2.html ops/acanto-site-state.json; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'cloudsales-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web/clients/acanto/landing-v2.html ops/acanto-site-state.json
          git commit -m 'ACANTO: add curated gallery and video section, remove direct price list'
          git push origin main

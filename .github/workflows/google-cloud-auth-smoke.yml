name: Google Cloud Auth Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/google-cloud-auth-smoke.yml

permissions:
  contents: read
  id-token: write

jobs:
  auth-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: cloudsales-507715
          workload_identity_provider: projects/1039655793672/locations/global/workloadIdentityPools/github-actions/providers/cloudsales-repo
          service_account: cloudsales-github-automation@cloudsales-507715.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify project and identity
        shell: bash
        run: |
          set -euo pipefail
          gcloud config set project cloudsales-507715
          echo "PROJECT=$(gcloud config get-value project)"
          echo "ACCOUNT=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')"
          gcloud services list --enabled --project=cloudsales-507715 --limit=20

name: Remove Dynamics Release 2026-09-03
on:
  push:
    paths:
      - '.github/scripts/remove_dynamics_release_20260903.py'
      - '.github/triggers/remove-dynamics-release-20260903.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Dynamics from release source
        run: python3 .github/scripts/remove_dynamics_release_20260903.py
      - name: Validate
        run: |
          ! grep -q "\['Dynamics 365','microsoft.com'\]" supabase/functions/cloudflare-site-brand-release/index.ts
      - name: Commit
        run: |
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add supabase/functions/cloudflare-site-brand-release/index.ts
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix(commercial): remove Dynamics 365 from Cloudflare release source'
          git push

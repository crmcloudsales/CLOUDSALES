name: Pennyworth Property Context Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pennyworth-property-context-patch.yml'
      - 'scripts/patch_pennyworth_property_context.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch property context capture
        run: python3 scripts/patch_pennyworth_property_context.py
      - name: Syntax check Worker
        run: node --check web/clients/pennyworth/worker-edge-template.mjs
      - name: Commit property context capture
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'cloudsales-bot'
          git config user.email 'cloudsales-bot@users.noreply.github.com'
          git add web/clients/pennyworth/worker-edge-template.mjs
          git commit -m 'feat(pennyworth): auto-capture complete property context'
          git push origin main

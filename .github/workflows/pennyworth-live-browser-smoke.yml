name: Pennyworth Live Browser Smoke
# Final live verification after legacy WhatsApp CSS scope fix

on:
  push:
    branches: [main]
    paths:
      - 'web/clients/pennyworth/**'
      - '.github/workflows/pennyworth-live-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Pennyworth live contact gates
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:390,height:844}});
            const pageErrors=[];
            const consoleErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e.message||e)));
            page.on('console',m=>{if(m.type()==='error') consoleErrors.push(m.text())});
            const url='https://pennyworth.cloudsales.app/?qa='+Date.now();
            const response=await page.goto(url,{waitUntil:'networkidle',timeout:45000});
            if(!response || !response.ok()) throw new Error('page_http_'+(response&&response.status()));
            await page.waitForTimeout(1000);
            const chat=page.locator('#pwChatLaunch'),wa=page.locator('#pwWaLaunch');
            console.log('PENNYWORTH_BROWSER_DIAGNOSTICS='+JSON.stringify({status:response.status(),chatCount:await chat.count(),waCount:await wa.count(),chatVisible:await chat.isVisible().catch(()=>false),waVisible:await wa.isVisible().catch(()=>false),pageErrors,consoleErrors}));
            if(pageErrors.length) throw new Error('page_errors: '+pageErrors.join(' | '));
            await chat.waitFor({state:'visible',timeout:3000});
            await wa.waitFor({state:'visible',timeout:3000});
            await chat.click();
            const chatPanel=page.locator('#pwPanel-chat');
            await chatPanel.waitFor({state:'visible',timeout:5000});
            if(await chatPanel.locator('input[name="name"]').count()!==1) throw new Error('chat_form_missing');
            await chatPanel.locator('.pwSubmit').waitFor({state:'visible',timeout:3000});
            await chatPanel.locator('.pwClose').waitFor({state:'visible',timeout:3000});
            await chatPanel.locator('.pwClose').click();
            await wa.click();
            const waPanel=page.locator('#pwPanel-whatsapp');
            await waPanel.waitFor({state:'visible',timeout:5000});
            if(await waPanel.locator('input[name="name"]').count()!==1) throw new Error('whatsapp_form_missing');
            await waPanel.locator('.pwSubmit').waitFor({state:'visible',timeout:3000});
            await waPanel.locator('.pwClose').waitFor({state:'visible',timeout:3000});
            await waPanel.locator('.pwClose').click();
            await page.screenshot({path:'pennyworth-live-mobile.png',fullPage:true});
            console.log('PENNYWORTH_CONTACT_GATES_PASS');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload live screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pennyworth-live-mobile-smoke
          path: pennyworth-live-mobile.png
          if-no-files-found: ignore
          retention-days: 2

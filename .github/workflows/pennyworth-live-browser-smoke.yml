name: Pennyworth Live Browser Smoke
# Verify live SEO, localization, unified contact form and secure field rules

on:
  push:
    branches: [main]
    paths:
      - 'web/clients/pennyworth/**'
      - '.github/workflows/pennyworth-live-browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify Pennyworth live form, locales and SEO
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            async function checkLocale(locale,expectedLang,expectedHero,dir='ltr'){
              const page=await browser.newPage({viewport:{width:390,height:844},locale});
              const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
              const r=await page.goto('https://pennyworth.cloudsales.app/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              if(!r||!r.ok())throw new Error(locale+'_http_'+(r&&r.status()));
              await page.waitForTimeout(1800);
              const htmlLang=await page.locator('html').getAttribute('lang'),htmlDir=await page.locator('html').getAttribute('dir');
              const hero=(await page.locator('.hero h1').innerText()).trim();
              if(errors.length)throw new Error(locale+'_page_errors:'+errors.join('|'));
              if(htmlLang!==expectedLang||htmlDir!==dir||hero!==expectedHero)throw new Error(locale+'_locale_mismatch');
              await page.close();
            }
            await checkLocale('fr-FR','fr','Nous redéfinissons l’expérience d’investissement.');
            await checkLocale('ar-AE','ar-AE','نعيد تعريف تجربة الاستثمار.','rtl');

            const page=await browser.newPage({viewport:{width:390,height:844},locale:'es-MX'});
            const errors=[];page.on('pageerror',e=>errors.push(String(e.message||e)));
            const r=await page.goto('https://pennyworth.cloudsales.app/?formqa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            if(!r||!r.ok())throw new Error('form_http_'+(r&&r.status()));
            await page.waitForTimeout(1800);
            if(errors.length)throw new Error('page_errors:'+errors.join('|'));
            if(await page.locator('#leadForm').count()!==1)throw new Error('not_single_form');
            const email=page.locator('#email'),delivery=page.locator('#delivery');
            if(await email.getAttribute('required')===null)throw new Error('email_not_required');
            if(await delivery.getAttribute('required')!==null)throw new Error('delivery_should_be_optional');
            const opts=await delivery.locator('option').evaluateAll(os=>os.map(o=>({value:o.value,text:o.textContent.trim()})));
            console.log('DELIVERY_OPTIONS='+JSON.stringify(opts));
            const expected=['','Inmediata','Hasta 6 meses','6 meses o más'];
            if(JSON.stringify(opts.map(x=>x.value))!==JSON.stringify(expected))throw new Error('delivery_options_invalid');

            await page.locator('#pwChatLaunch').click();
            const panel=page.locator('#pwUnifiedPanel');await panel.waitFor({state:'visible',timeout:5000});
            if(await page.locator('#leadForm').count()!==1||await panel.locator('#leadForm').count()!==1)throw new Error('chat_not_using_shared_form');
            await panel.locator('.pwClose').click();await page.waitForTimeout(200);
            if(await page.locator('#contact #leadForm').count()!==1)throw new Error('form_not_restored');
            await page.locator('#pwWaLaunch').click();await panel.waitFor({state:'visible',timeout:5000});
            if(await panel.locator('#leadForm').count()!==1)throw new Error('whatsapp_not_using_shared_form');
            await panel.locator('.pwClose').click();

            const robots=await page.locator('meta[name="robots"]').getAttribute('content');
            const canonical=await page.locator('link[rel="canonical"]').getAttribute('href');
            const title=await page.title();
            if(!robots||robots.includes('noindex')||canonical!=='https://pennyworth.cloudsales.app/'||!title.includes('PENNYWORTH')||!title.includes('CloudSales'))throw new Error('seo_regression');
            console.log('PENNYWORTH_UNIFIED_REQUIRED_EMAIL_OPTIONAL_DELIVERY_PASS');
            await page.close();await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

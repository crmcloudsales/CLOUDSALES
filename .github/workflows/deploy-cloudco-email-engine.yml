name: Deploy CLOUDCO Email Engine

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/cloudflare-control/**'
      - '.github/workflows/deploy-cloudco-email-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify Supabase deployment credential
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'SUPABASE_ACCESS_TOKEN repository secret is not configured.' >&2
            exit 1
          fi
      - name: Deploy CLOUDCO Email Engine bootstrap dispatcher
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -Eeuo pipefail
          supabase functions deploy cloudflare-control \
            --project-ref fkahaqprzgcimgyathqx \
            --no-verify-jwt

name: Senzik Official Logo Release

on:
  push:
    paths:
      - '.ops/senzik-official-logo-release.trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: senzik-official-logo-release
  cancel-in-progress: false

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply approved Senzik PRO logo
        run: python .ops/senzik_logo_pro_release.py

      - name: Verify Senzik source contract
        shell: bash
        run: |
          set -euo pipefail
          F='web/clients/senzik/landing-edge.html'
          grep -q 'senzik-future-investment-v5-user-gold-pro-vector' "$F"
          grep -q 'user-approved SENZIK gold PRO logo: transparent vector web treatment' "$F"
          grep -q 'mask:url("/senzik-logo.svg")' "$F"
          grep -q 'class="brandMark"' "$F"
          grep -q 'id="leadForm"' "$F"
          grep -q 'name="country_state"' "$F"
          ! grep -q 'autorización municipal' "$F"
          ! grep -q '¿Cuándo buscas entrega?' "$F"
          ! grep -q 'name="budget"' "$F"

      - name: Commit canonical Senzik source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- web/clients/senzik/landing-edge.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'cloudsales-release-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web/clients/senzik/landing-edge.html
          git commit -m 'Senzik: use approved transparent gold PRO vector logo'
          git pull --rebase origin main
          git push origin main

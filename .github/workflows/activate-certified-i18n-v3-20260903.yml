name: Activate Certified CloudSales I18N V3
on:
  push:
    branches: [main]
    paths:
      - 'web/i18n/catalog-v1/CERTIFIED'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudsales-certified-i18n-activation-v3
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Activate certified catalog layer
        run: python3 .github/scripts/activate_certified_i18n_v3_20260903.py
      - name: Validate commercial and PWA release source
        run: |
          grep -Fq '/cloudsales-static-i18n-v2.js' web/commercial.html
          grep -Fq '/cloudsales-static-i18n-v2.js' web/pwa.html
          ! grep -R -Fq '/subscribe?plan=pro' web/commercial.html web/commercial-sales-story-v1.js
          grep -Fq "cloudsales-pwa-2026.09.03.3-i18n-certified" web/sw.js
          grep -Fq 'VERSION="2026.09.03.11"' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'i18n_all_11' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'agentcloud_asset' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'VERSION="2026.09.03.3"' supabase/functions/cloudflare-pwa-brand-release/index.ts
          grep -Fq 'i18n_all_11' supabase/functions/cloudflare-pwa-brand-release/index.ts
          test -f web/i18n/catalog-v1/manifest.json
          test -f web/i18n/catalog-v1/CERTIFIED
          for l in es en fr it pt-BR de ar-AE ru he zh-CN ja; do test -f "web/i18n/catalog-v1/$l.json"; done
      - name: Commit production activation source
        run: |
          if git diff --quiet; then
            echo 'Certified i18n already activated'
            exit 0
          fi
          git config user.name 'CloudSales I18N Activation'
          git config user.email 'actions@users.noreply.github.com'
          git add web supabase/functions/cloudflare-site-brand-release/index.ts supabase/functions/cloudflare-pwa-brand-release/index.ts
          git commit -m 'feat(i18n): activate certified 11-language web and PWA layer'
          git push origin HEAD:main

name: CloudSales Trial 14 Sync Once

on:
  push:
    paths:
      - '.github/workflows/cloudsales-trial-14-sync-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply canonical 14-day trial messaging
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Commercial site: static, SEO-visible trial messaging.
          p=Path('web/commercial.html'); s=p.read_text()
          if '.trialBanner{' not in s:
              s=s.replace('</style>', '.trialBanner{margin:18px 0 4px;border:1px solid #5b3454;background:linear-gradient(135deg,#221225,#111119);border-radius:18px;padding:14px 16px;color:#f5d9eb;font-size:13px;font-weight:800}.trialMini{display:inline-flex;margin:7px 0 3px;border:1px solid #50314b;background:#211323;color:#ff9dcc;border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900}.trialCheckout{margin:12px 0;border:1px solid #50314b;background:#1d1320;border-radius:13px;padding:11px 13px;color:#e8cfe0;font-size:12px;line-height:1.45}</style>',1)
          if 'id="trialPricingBanner"' not in s:
              s=s.replace('<div class="plans">','<div id="trialPricingBanner" class="trialBanner" data-trial-copy="pricing"><b>14 días de prueba gratis.</b> Agrega tu método de pago hoy y no se cobra la mensualidad hasta que termine la prueba. Cancela antes de que termine si no deseas continuar.</div><div class="plans">',1)
          if 'data-trial-copy="plan"' not in s:
              s=s.replace('<div class="price">','<div class="trialMini" data-trial-copy="plan">14 días gratis</div><div class="price">')
          if 'data-trial-copy="checkout"' not in s:
              s=s.replace('<div class="emailrow">','<div class="trialCheckout" data-trial-copy="checkout"><b>Empieza con 14 días gratis.</b> Tu método de pago se guarda de forma segura en Stripe y la primera mensualidad se cobra al terminar la prueba, salvo que canceles antes.</div><div class="emailrow">',1)
          if '¿CloudSales tiene prueba gratis?' not in s:
              marker='<details><summary>¿Puedo cancelar?</summary>'
              trial='<details><summary>¿CloudSales tiene prueba gratis?</summary><p>Sí. Basic, Pro y Premium incluyen 14 días de prueba gratis. Se solicita un método de pago al iniciar y la primera mensualidad se cobra al terminar la prueba, salvo que canceles antes.</p></details>'
              if marker in s: s=s.replace(marker,trial+marker,1)
          # Hero micro: only if not already present.
          s=re.sub(r'(<div class="micro">)(?!14 días)', r'\1<b>14 días gratis</b> · ', s, count=1)
          p.write_text(s)

          # Commercial i18n: translate all trial-specific elements across the 11 locales.
          p=Path('web/cloudsales-i18n-v1.js'); s=p.read_text()
          if 'const TRIAL_COPY=' not in s:
              block=r'''
const TRIAL_COPY={
'es':{plan:'14 días gratis',pricing:'<b>14 días de prueba gratis.</b> Agrega tu método de pago hoy y no se cobra la mensualidad hasta que termine la prueba. Cancela antes de que termine si no deseas continuar.',checkout:'<b>Empieza con 14 días gratis.</b> Tu método de pago se guarda de forma segura en Stripe y la primera mensualidad se cobra al terminar la prueba, salvo que canceles antes.'},
'en':{plan:'14 days free',pricing:'<b>14-day free trial.</b> Add your payment method today and your monthly plan is not charged until the trial ends. Cancel before the trial ends if you do not want to continue.',checkout:'<b>Start with 14 days free.</b> Your payment method is stored securely by Stripe and the first monthly charge happens after the trial unless you cancel first.'},
'fr':{plan:'14 jours gratuits',pricing:'<b>Essai gratuit de 14 jours.</b> Ajoutez votre moyen de paiement aujourd’hui; l’abonnement mensuel n’est débité qu’à la fin de l’essai. Annulez avant la fin si vous ne souhaitez pas continuer.',checkout:'<b>Commencez avec 14 jours gratuits.</b> Votre moyen de paiement est enregistré de façon sécurisée par Stripe et le premier prélèvement a lieu après l’essai, sauf annulation.'},
'it':{plan:'14 giorni gratis',pricing:'<b>Prova gratuita di 14 giorni.</b> Aggiungi oggi il metodo di pagamento; il piano mensile viene addebitato solo al termine della prova. Annulla prima della fine se non vuoi continuare.',checkout:'<b>Inizia con 14 giorni gratis.</b> Il metodo di pagamento viene conservato in sicurezza da Stripe e il primo addebito mensile avviene dopo la prova, salvo annullamento.'},
'pt-BR':{plan:'14 dias grátis',pricing:'<b>Teste grátis por 14 dias.</b> Adicione hoje sua forma de pagamento; a mensalidade só é cobrada ao final do teste. Cancele antes do fim se não quiser continuar.',checkout:'<b>Comece com 14 dias grátis.</b> Sua forma de pagamento é armazenada com segurança pela Stripe e a primeira mensalidade é cobrada após o teste, salvo cancelamento.'},
'de':{plan:'14 Tage kostenlos',pricing:'<b>14 Tage kostenlos testen.</b> Hinterlegen Sie heute Ihre Zahlungsmethode; die Monatsgebühr wird erst nach dem Testzeitraum berechnet. Kündigen Sie vorher, wenn Sie nicht fortfahren möchten.',checkout:'<b>Starten Sie mit 14 kostenlosen Tagen.</b> Ihre Zahlungsmethode wird sicher bei Stripe gespeichert; die erste Monatsgebühr wird nach dem Testzeitraum fällig, sofern Sie nicht vorher kündigen.'},
'ar-AE':{plan:'14 يوماً مجاناً',pricing:'<b>تجربة مجانية لمدة 14 يوماً.</b> أضف وسيلة الدفع اليوم ولن يتم تحصيل الاشتراك الشهري حتى انتهاء التجربة. يمكنك الإلغاء قبل انتهائها.',checkout:'<b>ابدأ بـ 14 يوماً مجاناً.</b> تحفظ Stripe وسيلة الدفع بأمان ويتم أول تحصيل شهري بعد انتهاء التجربة ما لم تُلغِ قبل ذلك.'},
'ru':{plan:'14 дней бесплатно',pricing:'<b>14-дневный бесплатный период.</b> Добавьте способ оплаты сегодня; ежемесячная плата списывается только после окончания пробного периода. Отмените до его окончания, если не хотите продолжать.',checkout:'<b>Начните с 14 бесплатных дней.</b> Stripe безопасно сохранит способ оплаты, а первое ежемесячное списание произойдёт после пробного периода, если вы не отмените подписку.'},
'he':{plan:'14 ימים חינם',pricing:'<b>ניסיון חינם ל-14 ימים.</b> הוסיפו אמצעי תשלום היום; החיוב החודשי הראשון יתבצע רק לאחר תקופת הניסיון. ניתן לבטל לפני סיומה.',checkout:'<b>מתחילים עם 14 ימים חינם.</b> אמצעי התשלום נשמר באופן מאובטח ב-Stripe והחיוב החודשי הראשון יתבצע לאחר תקופת הניסיון, אלא אם תבטלו קודם.'},
'zh-CN':{plan:'免费试用 14 天',pricing:'<b>14 天免费试用。</b> 今天添加付款方式，试用结束前不会收取月费。如不想继续，可在试用结束前取消。',checkout:'<b>先免费使用 14 天。</b> Stripe 会安全保存付款方式；除非您提前取消，否则首次月费将在试用结束后收取。'},
'ja':{plan:'14日間無料',pricing:'<b>14日間の無料トライアル。</b> 本日支払い方法を登録しても、月額料金はトライアル終了まで請求されません。継続しない場合は終了前にキャンセルできます。',checkout:'<b>14日間無料で開始。</b> 支払い方法はStripeが安全に保存し、事前にキャンセルしない限り、最初の月額料金はトライアル終了後に請求されます。'}
};
function applyTrialCopy(locale){const c=TRIAL_COPY[locale]||TRIAL_COPY.en;document.querySelectorAll('[data-trial-copy="plan"]').forEach(x=>x.textContent=c.plan);document.querySelectorAll('[data-trial-copy="pricing"]').forEach(x=>x.innerHTML=c.pricing);document.querySelectorAll('[data-trial-copy="checkout"]').forEach(x=>x.innerHTML=c.checkout)}
'''
              s=s.replace('function canonicalLocale(x)',block+'function canonicalLocale(x)',1)
              s=s.replace('document.documentElement.dataset.csLocale=locale;attrs(locale);window.dispatchEvent', 'document.documentElement.dataset.csLocale=locale;attrs(locale);applyTrialCopy(locale);window.dispatchEvent',1)
          p.write_text(s)

          # PWA onboarding: static trial disclosure + plan labels.
          p=Path('web/pwa.html'); s=p.read_text()
          if '.trialOnboard{' not in s:
              s=s.replace('</style>', '.trialOnboard{border:1px solid #59364f;background:linear-gradient(135deg,#211423,#12121a);border-radius:16px;padding:13px 15px;margin:14px 0;color:#e9d5e3;font-size:12px;line-height:1.5}.trialPlanNote{display:block;margin-top:5px;color:#ff9dcc;font-size:10px;font-weight:900}</style>',1)
          if 'id="trialOnboardNotice"' not in s:
              s=s.replace('<div class="plans">','<div id="trialOnboardNotice" class="trialOnboard"><b>14 días de prueba gratis.</b> Elige tu plan; se solicita método de pago y la primera mensualidad se cobra después del trial, salvo cancelación previa.</div><div class="plans">',1)
          # Add small trial line inside every selectable plan without changing price text.
          s=re.sub(r'(<button[^>]*class="planpick"[^>]*>.*?)(</button>)', lambda m: m.group(1)+('<span class="trialPlanNote">14 días gratis</span>' if 'trialPlanNote' not in m.group(1) else '')+m.group(2), s, flags=re.S)
          p.write_text(s)

          # Auth/checkout lifecycle language must say trial, not paid activation.
          p=Path('web/auth-runtime-v2.js'); s=p.read_text()
          s=s.replace("const VERSION = '2026.09.01.5';","const VERSION = '2026.09.01.6';")
          s=s.replace('Plan ${plan.toUpperCase()} seleccionado por tu compra.</b><br>Completa los datos del negocio para activar CloudSales.', 'Plan ${plan.toUpperCase()} seleccionado para tu prueba gratis de 14 días.</b><br>Completa los datos del negocio para iniciar tu prueba de CloudSales.')
          s=s.replace("message('Pago confirmado. CloudSales quedó activado con tu plan.',true);", "message('Tu prueba gratis de 14 días quedó activada. La primera mensualidad se cobrará al terminar el trial, salvo que canceles antes.',true);")
          if 'const TRIAL_UI_COPY=' not in s:
              block=r'''
  const TRIAL_UI_COPY={
    es:{notice:'<b>14 días de prueba gratis.</b> Se solicita un método de pago y no se cobra la mensualidad hasta terminar la prueba. Cancela antes si no deseas continuar.',mini:'14 días gratis'},
    en:{notice:'<b>14-day free trial.</b> A payment method is required and the monthly plan is not charged until the trial ends. Cancel before then if you do not want to continue.',mini:'14 days free'},
    fr:{notice:'<b>Essai gratuit de 14 jours.</b> Un moyen de paiement est requis et l’abonnement n’est débité qu’à la fin de l’essai. Annulez avant si vous ne souhaitez pas continuer.',mini:'14 jours gratuits'},
    it:{notice:'<b>Prova gratuita di 14 giorni.</b> È richiesto un metodo di pagamento e il piano mensile viene addebitato solo al termine della prova.',mini:'14 giorni gratis'},
    'pt-BR':{notice:'<b>Teste grátis por 14 dias.</b> É necessário adicionar uma forma de pagamento e a mensalidade só é cobrada ao final do teste.',mini:'14 dias grátis'},
    de:{notice:'<b>14 Tage kostenlos testen.</b> Eine Zahlungsmethode ist erforderlich; die Monatsgebühr wird erst nach dem Testzeitraum berechnet.',mini:'14 Tage kostenlos'},
    'ar-AE':{notice:'<b>تجربة مجانية لمدة 14 يوماً.</b> يلزم إضافة وسيلة دفع ولن يتم تحصيل الاشتراك الشهري حتى انتهاء التجربة.',mini:'14 يوماً مجاناً'},
    ru:{notice:'<b>14 дней бесплатно.</b> Требуется способ оплаты; ежемесячная плата списывается только после окончания пробного периода.',mini:'14 дней бесплатно'},
    he:{notice:'<b>ניסיון חינם ל-14 ימים.</b> נדרש אמצעי תשלום והחיוב החודשי יתבצע רק לאחר תקופת הניסיון.',mini:'14 ימים חינם'},
    'zh-CN':{notice:'<b>14 天免费试用。</b> 需要添加付款方式，试用结束前不会收取月费。',mini:'免费试用 14 天'},
    ja:{notice:'<b>14日間の無料トライアル。</b> 支払い方法の登録が必要ですが、月額料金はトライアル終了まで請求されません。',mini:'14日間無料'}
  };
  function ensureTrialUi(){const lc=document.documentElement.dataset.csLocale||'es',c=TRIAL_UI_COPY[lc]||TRIAL_UI_COPY.en;const n=node('trialOnboardNotice');if(n)n.innerHTML=c.notice;document.querySelectorAll('.trialPlanNote').forEach(x=>x.textContent=c.mini)}
'''
              s=s.replace("  const CHECKOUT_KEY = 'cs_pending_checkout';", "  const CHECKOUT_KEY = 'cs_pending_checkout';\n"+block,1)
              s=s.replace('captureClaim(); captureCheckout(); prepareCheckoutUi(); bindCheckoutOnboarding(); ensureNotice();', 'captureClaim(); captureCheckout(); prepareCheckoutUi(); bindCheckoutOnboarding(); ensureNotice(); ensureTrialUi();',1)
              s=s.replace("window.addEventListener('cloudsales:locale'", "window.addEventListener('cloudsales:locale'",1) if "window.addEventListener('cloudsales:locale'" in s else s.replace("  function bind(){", "  window.addEventListener('cloudsales:locale',ensureTrialUi);\n\n  function bind(){",1)
          p.write_text(s)

          # Rotate SW so installed PWAs cannot retain pre-trial messaging.
          p=Path('web/sw.js'); s=p.read_text().replace("const CACHE='cloudsales-pwa-2026.09.01.3';","const CACHE='cloudsales-pwa-2026.09.01.4';"); p.write_text(s)

          # Keep canonical release version monotonic and explicit.
          p=Path('supabase/functions/cloudflare-pwa-release-v12/index.ts'); s=p.read_text(); s=s.replace('2026.09.01.5','2026.09.01.6'); p.write_text(s)

          # Guards: trial is canonical and old paid wording cannot reappear.
          checks={
            'web/commercial.html':['14 días de prueba gratis','14 días gratis','¿CloudSales tiene prueba gratis?'],
            'web/cloudsales-i18n-v1.js':['const TRIAL_COPY=','14-day free trial','14日間の無料トライアル'],
            'web/pwa.html':['trialOnboardNotice','14 días de prueba gratis','trialPlanNote'],
            'web/auth-runtime-v2.js':["2026.09.01.6",'TRIAL_UI_COPY','prueba gratis de 14 días quedó activada'],
            'web/sw.js':['cloudsales-pwa-2026.09.01.4'],
            'supabase/functions/cloudflare-pwa-release-v12/index.ts':['2026.09.01.6']
          }
          for fn,need in checks.items():
              txt=Path(fn).read_text()
              for x in need:
                  if x not in txt: raise SystemExit(f'missing guard {x} in {fn}')
          if 'Pago confirmado. CloudSales quedó activado con tu plan.' in Path('web/auth-runtime-v2.js').read_text(): raise SystemExit('legacy paid wording remains')
          PY
      - name: Validate JavaScript syntax
        run: |
          node --check web/cloudsales-i18n-v1.js
          node --check web/auth-runtime-v2.js
          node --check web/sw.js
      - name: Commit canonical trial policy
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add web/commercial.html web/cloudsales-i18n-v1.js web/pwa.html web/auth-runtime-v2.js web/sw.js supabase/functions/cloudflare-pwa-release-v12/index.ts
          git commit -m "feat(trial): make 14-day free trial canonical across CloudSales"
          git push origin HEAD:main

name: Build CloudSales Icon v4 2026-09-02
on:
  push:
    paths:
      - '.github/scripts/build_cloudsales_icon_v4_20260902.py'
      - 'web/assets/cloudsales-app-icon-source-v4.webp.b64'
      - '.github/triggers/icon-v4-20260902.txt'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Build exact v4 assets and capture diagnostic
        run: |
          set +e
          python3 .github/scripts/build_cloudsales_icon_v4_20260902.py > /tmp/icon-v4.log 2>&1
          code=$?
          set -e
          cat /tmp/icon-v4.log
          cp /tmp/icon-v4.log .github/triggers/icon-v4-build-log.txt
          echo "exit_code=$code" >> .github/triggers/icon-v4-build-log.txt
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add .github/triggers/icon-v4-build-log.txt
          git commit -m 'chore(pwa): capture icon v4 build diagnostic' || true
          git push || true
          exit $code
      - name: Validate binary geometry and references
        run: |
          python - <<'PY'
          from PIL import Image
          for p,s in [('web/assets/cloudsales-app-icon-official-v4.png',(512,512)),('web/assets/cloudsales-app-icon-official-v4-192.png',(192,192))]:
              im=Image.open(p)
              assert im.size==s,(p,im.size)
              print(p,im.size)
          PY
          grep -q 'cloudsales-app-icon-official-v4.png?v=2026090207' web/manifest.webmanifest
          grep -q 'cloudsales-pwa-2026.09.02.7' web/sw.js
          grep -q '/pwa-polish-runtime-v1.js' supabase/functions/cloudflare-pwa-brand-release/index.ts
          grep -q 'cloudsales-app-icon-official-v4.png' supabase/functions/cloudflare-pwa-brand-release/index.ts
      - name: Commit v4 production assets
        run: |
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web/assets/cloudsales-app-icon-official-v4.png web/assets/cloudsales-app-icon-official-v4-192.png web/manifest.webmanifest web/pwa.html web/sw.js supabase/functions/cloudflare-pwa-brand-release/index.ts
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'fix(pwa): replace launcher icon with user-supplied v4 asset'
          git push

name: Activate CloudSales Certified I18N Catalogs
on:
  push:
    branches: [main]
    paths:
      - 'web/i18n/catalog-v1/**'
      - '.github/scripts/activate_i18n_catalogs_20260903.py'
      - '.github/workflows/activate-i18n-catalogs-20260903.yml'
permissions:
  contents: write
concurrency:
  group: cloudsales-i18n-activation-v1
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Activate strict catalog architecture
        run: python3 .github/scripts/activate_i18n_catalogs_20260903.py
      - name: Validate browser syntax and release sources
        run: |
          node --check web/cloudsales-i18n-complete-v2.js
          node --check web/pwa-i18n-complete-v2.js
          node --check web/pwa-i18n-runtime-v1.js
          node --check web/cloudsales-brand-language-guard-v1.js
          grep -Fq 'VERSION="2026.09.03.11"' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'cloudsales-i18n-complete-v2.js' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'CATALOGS=' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'VERSION="2026.09.03.8"' supabase/functions/cloudflare-pwa-release-v12/index.ts
          grep -Fq '/pwa-i18n-complete-v2.js' supabase/functions/cloudflare-pwa-release-v12/index.ts
          ! grep -Fq "return (L[lc]||{})[text]||EN[text]||text" web/pwa-i18n-runtime-v1.js
          ! grep -Fq "strict-no-fallback" web/cloudsales-brand-language-guard-v1.js
      - name: Commit activation sources
        run: |
          git config user.name 'CloudSales I18N QA'
          git config user.email 'actions@users.noreply.github.com'
          git add web/pwa-i18n-runtime-v1.js web/cloudsales-brand-language-guard-v1.js supabase/functions/cloudflare-site-brand-release/index.ts
          if git diff --cached --quiet; then echo 'I18N activation already current'; exit 0; fi
          git commit -m 'feat(i18n): activate certified 11-language catalogs'
          git push origin HEAD:main

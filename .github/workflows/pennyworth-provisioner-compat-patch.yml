name: Pennyworth Provisioner Compat Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pennyworth-provisioner-compat-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Normalize unified template and preserve provisioner marker
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/clients/pennyworth/worker-edge-template.mjs')
          s=p.read_text()
          s=s.replace('String.raw\\`','String.raw`')
          s=s.replace('</script>\\`;','</script>`;')
          if '.pwPanel{position:fixed;' not in s:
              needle='#pwUnifiedPanel{position:fixed;'
              if needle not in s:
                  raise SystemExit('unified panel marker missing')
              s=s.replace(needle,'.pwPanel{position:fixed;display:none}\n'+needle,1)
          p.write_text(s)
          if 'const CONTACT_GATES_SCRIPT=String.raw`' not in s:
              raise SystemExit('String.raw opening normalization failed')
          if '})();</script>`;' not in s:
              raise SystemExit('String.raw closing normalization failed')
          PY
      - name: Commit compatibility fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'cloudsales-bot'
          git config user.email 'cloudsales-bot@users.noreply.github.com'
          git add web/clients/pennyworth/worker-edge-template.mjs
          git commit -m 'fix(pennyworth): normalize unified contact template closure'
          git push origin main

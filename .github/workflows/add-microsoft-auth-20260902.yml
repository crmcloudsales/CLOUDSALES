name: Add Microsoft Auth 2026-09-02
on:
  push:
    paths:
      - '.github/scripts/add_microsoft_auth_20260902.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth runtime
        run: python3 .github/scripts/add_microsoft_auth_20260902.py
      - name: Validate auth runtime
        run: |
          node --check web/auth-runtime-v2.js
          grep -q 'provider=azure' web/auth-runtime-v2.js
          grep -q 'Continuar con Microsoft' web/auth-runtime-v2.js
      - name: Commit runtime
        run: |
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web/auth-runtime-v2.js
          git commit -m 'feat(auth): Microsoft sign in and sign up'
          git push

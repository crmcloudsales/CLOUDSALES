name: P0 Checkout Activation Sync Once

on:
  push:
    paths:
      - '.github/workflows/p0-checkout-activation-sync-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/scripts/p0_checkout_activation_patch.py
      - name: Validate JavaScript and release markers
        run: |
          node --check web/cloudsales-i18n-v1.js
          node --check web/auth-runtime-v2.js
          node --check web/sw.js
          grep -q checkoutReturnBridge web/cloudsales-i18n-v1.js
          grep -q cs_pending_checkout web/auth-runtime-v2.js
          grep -q claim-checkout web/auth-runtime-v2.js
          grep -q checkout-status web/auth-runtime-v2.js
          grep -q cloudsales-pwa-2026.09.01.3 web/sw.js
          grep -q 'VERSION="2026.09.01.5"' supabase/functions/cloudflare-pwa-brand-release/index.ts
      - name: Commit canonical changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web/cloudsales-i18n-v1.js web/auth-runtime-v2.js web/sw.js supabase/functions/cloudflare-pwa-brand-release/index.ts
          git commit -m 'fix(p0): connect checkout return to automatic workspace activation'
          git push origin HEAD:main

name: Fix Domains Production v9
on:
  push:
    paths:
      - '.github/workflows/fix-domains-production-v9.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix generated Worker JS
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/cloudflare-site-brand-release/index.ts')
          s=p.read_text()
          assert 'VERSION="2026.09.01.8"' in s
          s=s.replace('VERSION="2026.09.01.8"','VERSION="2026.09.01.9"',1)
          s=s.replace(".find((x:any)=>Array.isArray(x?.[0])&&x[0].map((v:any)=>String(v).toLowerCase()).includes(tld))",".find(x=>Array.isArray(x?.[0])&&x[0].map(v=>String(v).toLowerCase()).includes(tld))",1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add supabase/functions/cloudflare-site-brand-release/index.ts
          git commit -m "fix(domains): correct worker RDAP JavaScript build"
          git pull --rebase origin main
          git push
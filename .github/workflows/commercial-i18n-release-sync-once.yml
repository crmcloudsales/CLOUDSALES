name: Commercial I18N Release Sync Once

on:
  push:
    paths:
      - '.github/workflows/commercial-i18n-release-sync-once.yml'

permissions:
  contents: write

# cleanup trigger 2026-09-01
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dedupe canonical i18n route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/cloudflare-site-brand-release/index.ts')
          s=p.read_text()
          route="if(p==='/cloudsales-i18n-v1.js')return r(I18N,'application/javascript','public,max-age=300');"
          while s.count(route)>1:
              s=s.replace(route+route,route,1)
          if s.count(route)!=1:
              raise SystemExit(f'i18n route count {s.count(route)}')
          for g in ['VERSION="2026.09.01.4"','/cloudsales-i18n-v1.js?v=${VERSION}','I18N=${JSON.stringify(i18n)}','i18n=await txt(`${RAW}/cloudsales-i18n-v1.js`)']:
              if g not in s: raise SystemExit('missing '+g)
          p.write_text(s)
          PY
          node --check web/cloudsales-i18n-v1.js
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add supabase/functions/cloudflare-site-brand-release/index.ts
          git commit -m "fix(i18n): dedupe commercial runtime route"
          git push origin HEAD:main

name: CloudSales Canonical Pricing Guard 2026-09-01
on:
  push:
    branches: [main]
    paths:
      - 'web/terms.html'
      - 'web/usage-pricing.html'
      - 'web/install.js'
      - 'web/commercial/conversion-v1.js'
      - 'ops/highlevel-marketplace-state.json'
      - '.github/workflows/cloudsales-pricing-sync-2026-08-31.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Validate canonical CloudSales pricing and usage markups
        run: |
          python3 <<'PY'
          from pathlib import Path
          checks = {
            'web/usage-pricing.html': ['×1.50','×1.35','×1.25','×2.00','landed provider cost'],
            'web/terms.html': ['cost × 1.50','cost × 1.35','cost × 1.25','cost × 2.00','September 1, 2026'],
            'web/install.js': ['costo +50%','costo +35%','costo +25%','Dominios: ×2'],
            'web/commercial/conversion-v1.js': ['×1.50 (+50%)','×1.35 (+35%)','×1.25 (+25%)','Dominios: costo real ×2'],
            'ops/highlevel-marketplace-state.json': ['"usage_markup_percent": 50','"usage_markup_percent": 35','"usage_markup_percent": 25','"domain_multiplier": 2']
          }
          for file, needles in checks.items():
              text = Path(file).read_text()
              missing = [x for x in needles if x not in text]
              assert not missing, f'{file} missing canonical pricing markers: {missing}'
          legacy = ['"usage_markup_percent": 12.5', '"usage_multiplier": 1.125']
          combined = '\n'.join(Path(f).read_text() for f in checks)
          for marker in legacy:
              assert marker not in combined, f'Legacy CloudSales markup found: {marker}'
          print('CloudSales canonical pricing policy validated: Basic +50%, Pro +35%, Premium +25%, Domains x2.')
          PY

name: Fix visible password recovery 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-visible-password-recovery-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activate recovery runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('web/pwa.html')
          s=p.read_text()
          tag='<script src="/auth-recovery-visible-v1.js?v=202609051945"></script>'
          if tag not in s:
              if '</body></html>' in s:
                  s=s.replace('</body></html>', tag+'</body></html>')
              else:
                  s=s.replace('</body>', tag+'</body>')
          p.write_text(s)
          sw=Path('web/sw.js')
          x=sw.read_text()
          x=re.sub(r"const CACHE='[^']+';", "const CACHE='cloudsales-pwa-2026.09.05.1945-auth-recovery';", x, count=1)
          sw.write_text(x)
          PY
      - name: Commit activation
        run: |
          git config user.name 'crmcloudsales'
          git config user.email 'crmcloudsales@gmail.com'
          git add web/pwa.html web/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): activate visible password recovery runtime'
          git push

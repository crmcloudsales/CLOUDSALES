name: Fix visible password recovery 2026-09-05

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-visible-password-recovery-20260905.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make password recovery visible and reliable
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('web/auth-runtime-v2.js')
          s = p.read_text()
          marker = 'CS_RECOVERY_VISIBLE_FIX_20260905'
          if marker not in s:
              patch = r'''

/* CS_RECOVERY_VISIBLE_FIX_20260905 */
(() => {
  'use strict';
  const ENDPOINT='https://fkahaqprzgcimgyathqx.supabase.co/functions/v1/auth-session';
  const byId=id=>document.getElementById(id);
  function showMessage(text,ok=false){
    const m=byId('authMsg');
    if(!m)return;
    m.className=ok?'ok':'err';
    m.textContent=text;
  }
  async function requestRecovery(btn){
    const email=String(byId('email')?.value||'').trim().toLowerCase();
    if(!email){showMessage('Escribe tu correo y después toca “¿Olvidaste tu contraseña?”.');byId('email')?.focus();return;}
    const old=btn.textContent;btn.disabled=true;btn.textContent='Enviando enlace…';
    try{
      const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'forgot_password',email,authorize_email:true,email_purpose:'password_recovery'})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok)throw new Error(d.error||'recovery_failed');
      showMessage('Te enviamos un enlace seguro para crear o cambiar tu contraseña. Revisa también Spam o Promociones.',true);
      let n=40;btn.textContent=`Reenviar en ${n}s`;
      const t=setInterval(()=>{n-=1;if(n<=0){clearInterval(t);btn.disabled=false;btn.textContent=old}else btn.textContent=`Reenviar en ${n}s`},1000);
    }catch(e){
      const code=String(e?.message||'');
      showMessage(code==='recovery_wait'?'Ya se solicitó un enlace recientemente. Revisa tu correo antes de pedir otro.':'No pudimos enviar el enlace todavía. Intenta nuevamente en un momento.');
      btn.disabled=false;btn.textContent=old;
    }
  }
  function install(){
    const pass=byId('password'),authBtn=byId('authBtn');
    if(!pass||!authBtn)return;
    let existing=byId('forgotPassword');
    if(existing){
      existing.style.setProperty('display','block','important');
      existing.style.setProperty('visibility','visible','important');
      existing.style.setProperty('opacity','1','important');
      existing.style.setProperty('margin','8px 0 12px','important');
      return;
    }
    let btn=byId('forgotPasswordVisible');
    if(!btn){
      btn=document.createElement('button');
      btn.id='forgotPasswordVisible';
      btn.type='button';
      btn.textContent='¿Olvidaste tu contraseña?';
      btn.setAttribute('aria-label','Recuperar contraseña de CloudSales');
      btn.style.cssText='display:block!important;width:100%;margin:8px 0 12px!important;padding:7px 4px!important;border:0!important;background:transparent!important;color:#F955B6!important;font-size:13px!important;line-height:18px!important;font-weight:800!important;text-align:right!important;cursor:pointer!important;visibility:visible!important;opacity:1!important;';
      btn.addEventListener('click',()=>requestRecovery(btn));
      const field=pass.closest('.field');
      if(field?.parentNode)field.insertAdjacentElement('afterend',btn);else authBtn.parentNode?.insertBefore(btn,authBtn);
    }
  }
  install();
  document.addEventListener('DOMContentLoaded',install,{once:true});
  new MutationObserver(install).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style']});
  setInterval(install,1200);
})();
'''
              p.write_text(s + patch)

          sw = Path('web/sw.js')
          x = sw.read_text()
          x = re.sub(r"const CACHE='[^']+';", "const CACHE='cloudsales-pwa-2026.09.05.1939-auth-recovery';", x, count=1)
          sw.write_text(x)
          PY
      - name: Commit recovery UI fix
        run: |
          git config user.name 'crmcloudsales'
          git config user.email 'crmcloudsales@gmail.com'
          git add web/auth-runtime-v2.js web/sw.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(auth): always show password recovery on sign-in'
          git push

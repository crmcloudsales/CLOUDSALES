name: I18N Full Fallback Once

on:
  push:
    paths:
      - '.github/workflows/i18n-full-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add complete English fallback coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/cloudsales-i18n-v1.js')

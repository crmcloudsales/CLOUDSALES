'¿No tienes CRM?':'No CRM?','Continúa con CloudSales. La infraestructura de gestión que Cloudy necesita puede quedar incluida dentro de tu cuenta.':'Continue with CloudSales. The management infrastructure Cloudy needs can be included in your account.','Continuar':'Continue',

'CloudSales combina protección de entrada, validaciones, señales de comportamiento y feedback comercial. El objetivo es que el proceso publicitario y comercial reciba información más limpia y útil, no simplemente acumular formularios.':'CloudSales combines entry protection, validation, behavioral signals, and sales feedback. The goal is to give advertising and sales cleaner, more useful information instead of simply accumulating forms.',
'Bloquea automatización no deseada':'Blocks unwanted automation','WAF, desafíos anti-bot, honeypots, rate limiting y controles server-side reducen tráfico y registros automatizados antes del CRM.':'WAF, anti-bot challenges, honeypots, rate limiting, and server-side controls reduce automated traffic and registrations before the CRM.',
'Evalúa cada registro':'Evaluates every submission','Lead Quality utiliza señales disponibles para clasificar intención y riesgo y decidir aceptar, desafiar o rechazar según configuración.':'Lead Quality uses available signals to classify intent and risk and decide whether to accept, challenge, or reject according to configuration.',
'Aprende del resultado comercial':'Learns from sales outcomes','Web Events y CRM Events conectan el origen del lead con citas, oportunidades y resultados para producir feedback más útil.':'Web Events and CRM Events connect lead origin with appointments, opportunities, and outcomes to produce more useful feedback.',
'Devuelve mejores señales':'Returns better signals','Cuando las plataformas lo permiten, CloudSales prepara Conversion API, atribución y audiencias usando eventos de mayor valor.':'When platforms allow it, CloudSales prepares Conversion API, attribution, and audiences using higher-value events.',
'Por qué existe CloudSales':'Why CloudSales exists','Mejores leads. Menos trabajo desperdiciado.':'Better leads. Less wasted work.',
'CloudSales fue diseñado para reducir el desperdicio comercial: junk leads, seguimiento perdido, herramientas desconectadas y horas frente a un CRM complejo. Convierte tecnología comercial e inteligencia artificial en':'CloudSales was designed to reduce sales waste: junk leads, lost follow-up, disconnected tools, and hours spent in a complex CRM. It turns sales technology and artificial intelligence into',
'trabajo ejecutado':'executed work','y devuelve al negocio tiempo, visibilidad y capacidad operativa.':'and gives the business back time, visibility, and operating capacity.',
'Tres planes simples. Empieza controlando tu operación desde el celular y aumenta protección, automatización, agentes y capacidad de equipo conforme crece tu negocio. Servicios de terceros —mensajería, llamadas, IA u otros consumos— pueden generar cargos de uso según tu plan.':'Three simple plans. Start by controlling your operation from your phone and add protection, automation, agents, and team capacity as your business grows. Third-party services—messaging, calls, AI, or other usage—may generate usage charges depending on your plan.',
'USD / mes':'USD / month','Leads, pipeline y citas':'Leads, pipeline and appointments','Control desde celular / PWA':'Mobile / PWA control','Elegir Basic':'Choose Basic','Todo Basic':'Everything in Basic','Calificación y seguimiento automatizado':'Automated qualification and follow-up','Automatización avanzada + Data Signals':'Advanced automation + Data Signals','Elegir Pro':'Choose Pro','Todo Pro':'Everything in Pro','2 usuarios incluidos':'2 users included','Más conexiones + control de equipo':'More connections + team control','Prioridad de automatización':'Automation priority','Asientos adicionales: $47 USD / mes':'Additional seats: $47 USD / month','Elegir Premium':'Choose Premium',
'Más que una aplicación.':'More than an app.','CloudSales también incluye formación y servicios opcionales para quienes quieren combinar automatización con acompañamiento humano especializado.':'CloudSales also includes training and optional services for teams that want to combine automation with specialized human support.',
'Marketing digital + IA, CRM, automatización, webmaster, community management, campañas y entrenamiento para equipos.':'Digital marketing + AI, CRM, automation, webmaster, community management, campaigns, and team training.','Ver Academy':'View Academy','Servicios profesionales':'Professional services','Webmaster, Community Management, administración de campañas y Concierge Setup cuando prefieres delegar una parte de la ejecución.':'Webmaster, Community Management, campaign management, and Concierge Setup when you prefer to delegate part of the execution.','Ver Servicios':'View Services','Refiere CloudSales con tu propio link. Recibe 40% de comisión sobre las ventas elegibles atribuidas a tu enlace.':'Refer CloudSales with your own link. Receive a 40% commission on eligible sales attributed to your link.','Conocer programa':'View program',
'Instala CloudSales donde trabajas.':'Install CloudSales wherever you work.','La misma cuenta funciona en navegador y como PWA. Instálala directamente en iPhone/iPad, Android o computadora.':'The same account works in the browser and as a PWA. Install it directly on iPhone/iPad, Android, or desktop.',
'Preguntas frecuentes.':'Frequently asked questions.','Lo esencial antes de conectar tu negocio a CloudSales.':'What you need to know before connecting your business to CloudSales.',
'¿Qué es CloudSales?':'What is CloudSales?','Es una Business Management Platform operada por inteligencia artificial. Reúne la operación comercial y conecta las herramientas que ya usas para que Cloudy pueda ayudarte a ejecutar trabajo, no solo mostrar información.':'It is an AI-operated Business Management Platform. It brings sales operations together and connects the tools you already use so Cloudy can help execute work, not just display information.',
'¿CloudSales es un CRM?':'Is CloudSales a CRM?','No se limita a ser un CRM. Puede controlar un CRM existente o utilizar infraestructura de gestión incluida cuando no tienes uno. CloudSales se coloca por encima del stack como capa de operación, IA y experiencia móvil.':'It is not limited to being a CRM. It can control an existing CRM or use included management infrastructure when you do not have one. CloudSales sits above the stack as an operations, AI, and mobile experience layer.',
'¿Quién es Cloudy?':'Who is Cloudy?','Cloudy es el AI Operator central de CloudSales. Interpreta instrucciones, consulta contexto, coordina herramientas y AgentCloud, ejecuta acciones permitidas y reporta resultados.':'Cloudy is the central AI Operator in CloudSales. It interprets instructions, reviews context, coordinates tools and AgentCloud, executes permitted actions, and reports results.',
'¿Qué es AgentCloud?':'What is AgentCloud?','Es el conjunto de agentes de IA especializados de CloudSales. Pueden asumir funciones concretas —por ejemplo seguimiento, citas, contenido o mensajería— bajo políticas, permisos y supervisión de Cloudy.':'AgentCloud is CloudSales’ set of specialized AI agents. They can take on specific functions—such as follow-up, appointments, content, or messaging—under policies, permissions, and Cloudy supervision.',
'¿Puedo conservar mi CRM actual?':'Can I keep my current CRM?','Sí. La estrategia de CloudSales es conectarse con CRMs líderes y operar sobre ellos. La profundidad de cada integración depende de los permisos y APIs disponibles de cada proveedor.':'Yes. CloudSales is designed to connect with leading CRMs and operate on top of them. Integration depth depends on each provider’s available permissions and APIs.',
'¿Qué pasa si no tengo CRM?':'What if I do not have a CRM?','Puedes comenzar con CloudSales sin contratar un CRM adicional por separado. CloudSales puede incluir la infraestructura de gestión necesaria para contactos, pipeline, conversaciones y automatizaciones.':'You can start with CloudSales without purchasing a separate CRM. CloudSales can include the management infrastructure needed for contacts, pipeline, conversations, and automations.',
'¿Puedo importar mis contactos y oportunidades?':'Can I import my contacts and opportunities?','Sí, cuando el origen y el CRM conectado ofrecen exportación o APIs compatibles. CloudSales está diseñado para mapear contactos, oportunidades y campos para reducir la configuración manual.':'Yes, when the source and connected CRM provide export or compatible APIs. CloudSales is designed to map contacts, opportunities, and fields to reduce manual setup.',
'¿Cloudy puede actuar sin pedirme permiso cada vez?':'Can Cloudy act without asking me every time?','Puede automatizar tareas dentro del nivel de autonomía que autorices. Acciones sensibles, costosas, destructivas o con impacto legal pueden configurarse para pedir aprobación.':'It can automate tasks within the autonomy level you authorize. Sensitive, costly, destructive, or legally significant actions can be configured to require approval.',
'¿Cómo mejora CloudSales la calidad de los leads?':'How does CloudSales improve lead quality?','Actúa en varias capas: protege formularios y landings, detecta automatización no deseada, valida señales del registro, asigna un score de calidad, deduplica y conecta el comportamiento web con lo que después ocurre en el CRM. Ese feedback permite trabajar con señales comerciales más útiles.':'It works across several layers: protecting forms and landing pages, detecting unwanted automation, validating submission signals, assigning a quality score, deduplicating, and connecting web behavior with what later happens in the CRM. That feedback produces more useful sales signals.',
'¿CloudSales filtra después o puede bloquear antes del CRM?':'Does CloudSales filter afterward or can it block before the CRM?','El Junk Lead Firewall está diseñado para intervenir antes de que el registro pase al flujo comercial cuando la campaña utiliza una landing/gateway de CloudSales. Así se puede desafiar o rechazar tráfico sospechoso antes de contaminar el CRM.':'The Junk Lead Firewall is designed to intervene before a submission enters the sales flow when the campaign uses a CloudSales landing/gateway. Suspicious traffic can be challenged or rejected before it contaminates the CRM.',
'¿Qué son Web Events y CRM Events?':'What are Web Events and CRM Events?','Son eventos que conectan lo que una persona hace en la web con lo que ocurre después en ventas: lead aceptado, cita, oportunidad, avance de etapa, compra u otros resultados configurados.':'They are events that connect what a person does on the web with what happens later in sales: accepted lead, appointment, opportunity, stage progression, purchase, or other configured outcomes.',
'¿CloudSales puede trabajar con Meta, Google, TikTok y LinkedIn?':'Can CloudSales work with Meta, Google, TikTok, and LinkedIn?','La plataforma está diseñada para conectar ecosistemas publicitarios y sociales mediante APIs e integraciones disponibles. Cada conexión requiere autorización del propietario de la cuenta y está sujeta a las políticas de cada plataforma.':'The platform is designed to connect advertising and social ecosystems through available APIs and integrations. Each connection requires account-owner authorization and is subject to each platform’s policies.',
'¿Cloudy puede publicar contenido?':'Can Cloudy publish content?','Sí, cuando el usuario conecta los canales y archivos necesarios. Cloudy puede usar materiales autorizados —por ejemplo del Drive del negocio— para preparar contenido y coordinar su publicación.':'Yes, when the user connects the necessary channels and files. Cloudy can use authorized materials—for example from the business Drive—to prepare content and coordinate publishing.',
'¿Puedo trabajar solo desde mi celular?':'Can I work only from my phone?','Ese es uno de los objetivos centrales: reducir drásticamente la dependencia de la computadora. La PWA permite gestionar lo esencial y hablar con Cloudy desde el teléfono. Algunas autorizaciones externas pueden abrir páginas del proveedor.':'That is one of the core goals: dramatically reduce dependence on a computer. The PWA lets you manage the essentials and talk with Cloudy from your phone. Some external authorizations may open provider pages.',
'¿Funciona en iPhone, Android y computadora?':'Does it work on iPhone, Android, and desktop?','Sí. CloudSales es una PWA instalable y también funciona desde navegador. La misma cuenta se utiliza en todos los dispositivos compatibles.':'Yes. CloudSales is an installable PWA and also works in a browser. The same account is used across compatible devices.',
'¿Necesito conocimientos técnicos?':'Do I need technical knowledge?','No para la operación cotidiana. El diseño busca que el usuario describa objetivos y Cloudy se encargue de la mayor parte de la ejecución. Integraciones avanzadas pueden requerir permisos administrativos de las plataformas conectadas.':'Not for everyday operation. The design lets the user describe goals and Cloudy handle most of the execution. Advanced integrations may require administrative permissions on connected platforms.',
'¿Mis credenciales quedan visibles para Cloudy?':'Are my credentials visible to Cloudy?','Las integraciones sensibles se diseñan para trabajar con OAuth, tokens y almacenamiento seguro del lado servidor. La PWA no necesita mostrar secretos para operar las conexiones.':'Sensitive integrations are designed to use OAuth, tokens, and secure server-side storage. The PWA does not need to expose secrets to operate connections.',
'¿CloudSales reemplaza una agencia o un equipo completo?':'Does CloudSales replace an agency or a full team?','Puede eliminar muchas tareas manuales y reducir la necesidad de varias herramientas o servicios separados, pero cada negocio decide qué funciones automatizar y cuáles mantener con personas. También ofrecemos servicios profesionales opcionales.':'It can eliminate many manual tasks and reduce the need for multiple separate tools or services, but each business decides which functions to automate and which to keep human. Optional professional services are also available.',
'¿Hay costos adicionales?':'Are there additional costs?','La suscripción cubre el plan de CloudSales. Algunos servicios externos —mensajes, llamadas, modelos de IA, publicidad u otros consumos— pueden cobrarse por uso. Los servicios profesionales y Academy se venden por separado.':'The subscription covers the CloudSales plan. Some external services—messages, calls, AI models, advertising, or other usage—may be billed by usage. Professional services and Academy are sold separately.',
'¿Puedo cancelar?':'Can I cancel?','Sí. Puedes cancelar de acuerdo con los términos de tu suscripción y conservar acceso según las condiciones vigentes del periodo contratado.':'Yes. You can cancel according to your subscription terms and keep access according to the conditions of the current paid period.',
'CloudSales · Better Leads · Full CRM Control · un producto de CloudCo.':'CloudSales · Better Leads · Full CRM Control · a CloudCo product.','Las integraciones, automatizaciones y funciones disponibles dependen de permisos, APIs y políticas de cada proveedor.':'Available integrations, automations, and features depend on each provider’s permissions, APIs, and policies.',
'Activar CloudSales':'Activate CloudSales','Checkout seguro por Stripe':'Secure checkout by Stripe','Tu correo':'Your email','Escribe un correo válido.':'Enter a valid email.','Preparando checkout…':'Preparing checkout…','No pudimos abrir el checkout: ':'We could not open checkout: '
};
'''
            s=s.replace(marker,block+marker,1)
          s=s.replace('const tr=dict[base];if(tr)n.nodeValue=n.__csOriginal.replace(base,tr)', 'const tr=dict[base]||EN_FULL[base];if(tr)n.nodeValue=n.__csOriginal.replace(base,tr)')
          s=s.replace("document.addEventListener('click',()=>document.querySelectorAll('.csLang.open').forEach(x=>x.classList.remove('open')),{once:true,capture:true})", "if(!document.documentElement.dataset.csLangCloseBound){document.documentElement.dataset.csLangCloseBound='1';document.addEventListener('click',e=>{if(!e.target.closest('.csLang'))document.querySelectorAll('.csLang.open').forEach(x=>x.classList.remove('open'))},true)}")
          # translate placeholder and scoped checkout status dynamically
          hook="document.documentElement.dataset.csLocale=locale;window.dispatchEvent"
          if 'function attrs(locale)' not in s:
            extra="""function attrs(locale){const d=T[locale]||{},tr=x=>locale==='es'?x:(d[x]||EN_FULL[x]||x);const email=document.getElementById('cemail');if(email){if(!email.dataset.csOrigPlaceholder)email.dataset.csOrigPlaceholder=email.getAttribute('placeholder')||'';email.setAttribute('placeholder',tr(email.dataset.csOrigPlaceholder))}const err=document.getElementById('cerr');if(err&&!err.dataset.csI18nObs){err.dataset.csI18nObs='1';new MutationObserver(()=>{const v=err.textContent||'';if(locale==='es')return;for(const [a,b] of Object.entries({...EN_FULL,...d})){if(v===a){err.textContent=b;return}if(a.endsWith(': ')&&v.startsWith(a)){err.textContent=b+v.slice(a.length);return}}}).observe(err,{childList:true,characterData:true,subtree:true})}}\n"""
            s=s.replace('function setLocale(x)',extra+'function setLocale(x)',1)
          s=s.replace("document.documentElement.dataset.csLocale=locale;window.dispatchEvent", "document.documentElement.dataset.csLocale=locale;attrs(locale);window.dispatchEvent")
          p.write_text(s)

name: I18N Full Fallback Once

on:
  push:
    paths:
      - '.github/workflows/i18n-full-fallback-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recover and run prepared patch
        run: |
          git show HEAD^:.github/workflows/i18n-full-fallback-once.yml > /tmp/prepared.yml
          python - <<'PY'
          from pathlib import Path
          s=Path('/tmp/prepared.yml').read_text()
          start=s.index("          python - <<'PY'\n")+len("          python - <<'PY'\n")
          end=s.index("\n          PY",start)
          code='\n'.join(line[10:] if line.startswith('          ') else line for line in s[start:end].splitlines())
          Path('/tmp/i18n_patch.py').write_text(code)
          PY
          python /tmp/i18n_patch.py
      - name: Validate coverage
        run: |
          node --check web/cloudsales-i18n-v1.js
          grep -q "What if I do not have a CRM?" web/cloudsales-i18n-v1.js
          grep -q "Secure checkout by Stripe" web/cloudsales-i18n-v1.js
          grep -q "EN_FULL\[base\]" web/cloudsales-i18n-v1.js
      - name: Commit fallback coverage
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add web/cloudsales-i18n-v1.js
          git commit -m "feat(i18n): complete commercial copy fallback coverage"
          git push origin HEAD:main

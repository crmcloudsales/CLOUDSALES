'Entiende tu instrucción':'Understands your instruction','Consulta contexto':'Reviews context','Planifica':'Plans','Usa las conexiones autorizadas':'Uses authorized connections','Ejecuta':'Executes','Reporta resultado':'Reports results',
'Conecta tu CRM. O deja que CloudSales incluya la infraestructura.':'Connect your CRM. Or let CloudSales include the infrastructure.',

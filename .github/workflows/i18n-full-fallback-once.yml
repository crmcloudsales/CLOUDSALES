'CloudSales es la capa operativa que conecta las herramientas de tu negocio y las convierte en trabajo ejecutado. Tu CRM puede seguir siendo la infraestructura; CloudSales es la experiencia, el cerebro operativo y el control desde tu celular.':'CloudSales is the operating layer that connects your business tools and turns them into executed work. Your CRM can remain the infrastructure; CloudSales is the experience, the operating brain, and the control layer on your phone.',
'La BMP donde ves lo importante: leads, pipeline, conversaciones, archivos, campañas, citas, señales y resultados. Menos menús. Menos fricción.':'The BMP where you see what matters: leads, pipeline, conversations, files, campaigns, appointments, signals, and results. Fewer menus. Less friction.',

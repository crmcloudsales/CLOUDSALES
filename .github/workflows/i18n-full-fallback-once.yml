'CloudSales ayuda a reducir junk leads, prioriza oportunidades reales y simplifica tu operación comercial. Leads, conversaciones, citas, pipeline, automatización y Cloudy desde una sola aplicación.':'CloudSales helps reduce junk leads, prioritize real opportunities, and simplify your sales operation. Leads, conversations, appointments, pipeline, automation, and Cloudy in one app.',
'Cloudy online':'Cloudy online','Alta intención':'High intent','Por aprobar':'Pending approval','Revisa los leads de hoy, sigue los de mayor intención y dime qué necesita mi aprobación.':'Review today’s leads, follow up with the highest-intent ones, and tell me what needs my approval.',

name: Improve CloudSales Commercial Site

on:
  push:
    paths:
      - "scripts/improve_cloudsales_commercial.py"
      - ".github/workflows/improve-cloudsales-commercial.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-commercial:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply UX patch
        run: python scripts/improve_cloudsales_commercial.py

      - name: Validate commercial source
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('web/commercial.html').read_text(encoding='utf-8')
          runtime=Path('web/commercial-sales-story-v1.js').read_text(encoding='utf-8')
          checks={
            'basic47': bool(re.search(r'\$\s*47', s)),
            'pro97': bool(re.search(r'\$\s*97', s)),
            'premium147': bool(re.search(r'\$\s*147', s)),
            'outcomes': all(x in s for x in ['More Qualified Leads','More Appointments','More Sales']),
            'sales_story_loaded':'commercial-sales-story-v1.js' in s,
            'trial_cta':'7 DÍAS CLOUDY GRATIS' in runtime and '/subscribe?plan=pro' in runtime,
            'cloudy_story': all(x in runtime for x in ['Junk Lead Firewall','MEJORA CONTINUA','AGENTCLOUD','Qué hace la app']),
          }
          print(checks)
          assert all(checks.values()), checks
          PY

      - name: Commit commercial update
        run: |
          if git diff --quiet -- web/commercial.html; then
            echo "Commercial site already up to date"
            exit 0
          fi
          git config user.name "cloudsales-build-bot"
          git config user.email "cloudsales-build-bot@users.noreply.github.com"
          git add web/commercial.html
          git commit -m "feat(site): launch Cloudy conversion story and 7-day trial CTA"
          git push

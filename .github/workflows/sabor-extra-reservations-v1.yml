name: Sabor Extra Reservations v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sabor-extra-reservations-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Add opening hours and WhatsApp reservation calendar
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('web/clients/sabor-extra/landing-edge.html')
          s=p.read_text()
          if 'id="reserva"' in s and 'sabor-extra-reservation-v1' in s:
              raise SystemExit(0)
          s=s.replace('"acceptsReservations":false','"acceptsReservations":true',1)
          s=s.replace('<a href="#menu">Menú</a><a href="#opiniones">Opiniones</a>','<a href="#menu">Menú</a><a href="#reserva">Reservar</a><a href="#opiniones">Opiniones</a>',1)
          css='''\n.reservation{background:#fff7e8}.reservation-grid{display:grid;grid-template-columns:.82fr 1.18fr;gap:22px;align-items:start}.hours-card,.reserve-card{background:#fff;border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:var(--shadow)}.hours-card h3,.reserve-card h3{font:600 34px/1.05 Georgia,serif;margin:8px 0 15px}.hours-list{display:grid;gap:0;margin-top:16px}.hours-row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-top:1px solid var(--line);font-size:14px}.hours-row strong{color:var(--cacao)}.hours-row span{color:var(--muted);text-align:right}.reserve-form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.reserve-field.full{grid-column:1/-1}.reserve-field label{display:block;font-size:11px;font-weight:850;letter-spacing:.04em;margin:0 0 6px;color:#705f55}.reserve-field input,.reserve-field select,.reserve-field textarea{width:100%;border:1px solid #dbcbb9;border-radius:14px;padding:13px 14px;background:#fffcf7;color:var(--cacao);font:inherit;outline:none}.reserve-field textarea{min-height:86px;resize:vertical}.reserve-help{font-size:11px;line-height:1.55;color:var(--muted);margin:10px 0 0}.reserve-submit{width:100%;border:0;margin-top:12px;min-height:52px}.reserve-status{display:none;margin-top:10px;padding:11px 13px;border-radius:12px;font-size:12px}.reserve-status.show{display:block;background:#eef8f0;color:#1d5d34}.closed-note{margin-top:14px;padding:13px;border-radius:14px;background:#fff3dc;color:#6d4a16;font-size:12px;line-height:1.5}@media(max-width:900px){.reservation-grid{grid-template-columns:1fr}}@media(max-width:620px){.reserve-form{grid-template-columns:1fr}.reserve-field.full{grid-column:auto}}\n'''
          s=s.replace('</style>',css+'</style>',1)
          section='''<section class="section reservation" id="reserva"><div class="wrap"><div class="section-head"><div class="eyebrow">Reserva tu mesa</div><h2>Elige día y hora. Confirma por WhatsApp.</h2><p>Horario de atención publicado recientemente: lunes a viernes de 7:30 AM a 4:30 PM. Sábado y domingo cerrado. La solicitud se prepara automáticamente y abre WhatsApp para enviarla directamente al restaurante.</p></div><div class="reservation-grid"><aside class="hours-card"><div class="eyebrow">Horario de atención</div><h3>Esta semana</h3><div class="hours-list"><div class="hours-row"><strong>Lunes</strong><span>7:30 AM – 4:30 PM</span></div><div class="hours-row"><strong>Martes</strong><span>7:30 AM – 4:30 PM</span></div><div class="hours-row"><strong>Miércoles</strong><span>7:30 AM – 4:30 PM</span></div><div class="hours-row"><strong>Jueves</strong><span>7:30 AM – 4:30 PM</span></div><div class="hours-row"><strong>Viernes</strong><span>7:30 AM – 4:30 PM</span></div><div class="hours-row"><strong>Sábado</strong><span>Cerrado</span></div><div class="hours-row"><strong>Domingo</strong><span>Cerrado</span></div></div><div class="closed-note">Las reservas se solicitan dentro del horario de servicio. Para que haya tiempo suficiente para atender la mesa antes del cierre, el calendario ofrece horarios hasta las 3:30 PM.</div></aside><div class="reserve-card"><div class="eyebrow">Solicitud de reserva</div><h3>¿Cuándo quieres venir?</h3><form id="reservationForm" class="reserve-form" novalidate><div class="reserve-field"><label for="resName">Nombre</label><input id="resName" name="name" autocomplete="name" maxlength="60" required placeholder="Tu nombre"></div><div class="reserve-field"><label for="resGuests">Personas</label><select id="resGuests" name="guests" required><option value="">Selecciona</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option><option value="11+">11 o más</option></select></div><div class="reserve-field"><label for="resDate">Fecha</label><input id="resDate" name="date" type="date" required></div><div class="reserve-field"><label for="resTime">Hora</label><select id="resTime" name="time" required><option value="">Selecciona</option><option>07:30</option><option>08:00</option><option>08:30</option><option>09:00</option><option>09:30</option><option>10:00</option><option>10:30</option><option>11:00</option><option>11:30</option><option>12:00</option><option>12:30</option><option>13:00</option><option>13:30</option><option>14:00</option><option>14:30</option><option>15:00</option><option>15:30</option></select></div><div class="reserve-field full"><label for="resNote">Comentario <span style="font-weight:500">(opcional)</span></label><textarea id="resNote" name="note" maxlength="180" placeholder="Ej. silla para bebé, cumpleaños, mesa exterior..."></textarea></div><div class="reserve-field full"><button class="btn primary reserve-submit" type="submit">Solicitar reserva por WhatsApp</button><p class="reserve-help">Al continuar se abrirá WhatsApp con la solicitud lista. Toca <b>Enviar</b> para notificar directamente a Sabor Extra.</p><div id="reserveStatus" class="reserve-status" role="status" aria-live="polite"></div></div></form></div></div></div></section>'''
          anchor='<section class="section reviews" id="opiniones">'
          if anchor not in s:
              raise SystemExit('reviews anchor missing')
          s=s.replace(anchor,section+'\n'+anchor,1)
          js='''<script id="sabor-extra-reservation-v1">(()=>{const f=document.getElementById('reservationForm'),d=document.getElementById('resDate'),st=document.getElementById('reserveStatus');if(!f||!d)return;const pad=n=>String(n).padStart(2,'0'),localDate=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`;const today=new Date();today.setHours(0,0,0,0);d.min=localDate(today);const max=new Date(today);max.setDate(max.getDate()+60);d.max=localDate(max);function validDay(v){if(!v)return false;const x=new Date(v+'T12:00:00');const day=x.getDay();return day>=1&&day<=5}d.addEventListener('change',()=>{if(d.value&&!validDay(d.value)){st.textContent='Sabor Extra aparece cerrado sábado y domingo. Elige una fecha de lunes a viernes.';st.className='reserve-status show';d.value=''}else{st.className='reserve-status'}});f.addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('resName').value.trim(),guests=document.getElementById('resGuests').value,date=d.value,time=document.getElementById('resTime').value,note=document.getElementById('resNote').value.trim();if(name.length<2||!guests||!date||!time||!validDay(date)){st.textContent='Completa nombre, personas, fecha y hora dentro del horario de lunes a viernes.';st.className='reserve-status show';return}const pretty=new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(date+'T12:00:00'));let msg=`Hola Sabor Extra 👋 Quiero solicitar una reserva.\n\nNombre: ${name}\nPersonas: ${guests}\nFecha: ${pretty}\nHora: ${time}`;if(note)msg+=`\nComentario: ${note}`;msg+='\n\n¿Me pueden confirmar disponibilidad, por favor?';const url='https://wa.me/529848036703?text='+encodeURIComponent(msg);st.textContent='Abriendo WhatsApp con tu solicitud lista para enviar…';st.className='reserve-status show';window.open(url,'_blank','noopener,noreferrer')})})();</script>'''
          s=s.replace('</body>',js+'\n</body>',1)
          assert 'sabor-extra-reservation-v1' in s and 'id="reserva"' in s and 'acceptsReservations":true' in s
          p.write_text(s)
          PY
      - name: Commit reservation experience
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'CloudSales Automation'
          git config user.email 'info@cloudsales.app'
          git add web/clients/sabor-extra/landing-edge.html
          git commit -m 'feat(sabor-extra): hours and WhatsApp reservations'
          git push origin HEAD:main
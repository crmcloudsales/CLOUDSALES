name: CloudSales mobile UX and checkout hotfix 2026-09-05
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-ux-checkout-hotfix-20260905.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply mobile UX hotfix
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/cloudsales_mobile_hotfix.py
          python /tmp/cloudsales_mobile_hotfix.py
      - name: Commit hotfix
        run: |
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web/commercial.html web/native-shell-runtime-v1.js web/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(mobile): integrate bottom nav and repair hamburger"
          git push

name: PWA Version Sync Once

on:
  push:
    paths:
      - '.github/workflows/pwa-version-sync-once.yml'

permissions:
  contents: write

# trigger 2026-09-01
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match canonical release to live version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/cloudflare-pwa-brand-release/index.ts')
          s=p.read_text()
          old='const VERSION="2026.09.01.2";'
          new='const VERSION="2026.09.01.3";'
          if new not in s:
              if old not in s: raise SystemExit('expected version marker not found')
              p.write_text(s.replace(old,new,1))
          PY
          grep -q 'const VERSION="2026.09.01.3";' supabase/functions/cloudflare-pwa-brand-release/index.ts
      - name: Commit version alignment
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add supabase/functions/cloudflare-pwa-brand-release/index.ts
          git commit -m "chore(pwa): align canonical release version with production"
          git push origin HEAD:main

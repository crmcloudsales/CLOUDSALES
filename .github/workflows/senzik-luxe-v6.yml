name: Senzik Luxe V6

on:
  push:
    paths:
      - '.github/workflows/senzik-luxe-v6.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Senzik luxury UI and effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('web/clients/senzik/landing-edge.html')
          x=p.read_text()
          old='<!-- senzik-future-investment-v5-user-gold-pro-vector -->'
          new='<!-- senzik-luxe-investment-v6-gold-lenis -->'
          if new in x:
              print('V6 already applied')
              raise SystemExit(0)
          if old not in x:
              raise SystemExit('Expected Senzik V5 marker not found; refusing unsafe patch')
          x=x.replace(old,new,1)
          head='''
<!-- SENZIK LUXE V6: visual-only redesign; content remains unchanged -->
<link rel="stylesheet" href="https://unpkg.com/lenis@1.3.26/dist/lenis.css">
<script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
<style id="senzik-luxe-v6">
:root{
  --bg:#020806!important;--bg2:#06100c!important;--panel:rgba(5,16,12,.70)!important;--panel2:rgba(8,22,16,.86)!important;
  --text:#f7f4ea!important;--muted:#a8aea8!important;--line:rgba(219,177,84,.18)!important;
  --mint:#e1b85f!important;--mint2:#bd8b2f!important;--cyan:#e8c978!important;
  --gold:#d7aa4d!important;--gold-soft:#f2d47e!important;--gold-deep:#8f6422!important;--gold-line:rgba(215,170,77,.34)!important;--gold-glow:rgba(215,170,77,.18)!important;

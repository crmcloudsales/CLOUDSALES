}
html{background:#020806!important}
body{background:radial-gradient(circle at 16% 0%,rgba(105,91,33,.16),transparent 28%),radial-gradient(circle at 86% 7%,rgba(21,73,47,.20),transparent 28%),linear-gradient(180deg,#020806 0%,#05100c 48%,#020806 100%)!important;color:var(--text)!important}
body:before{content:"";position:fixed;inset:-25vmax;z-index:-1;pointer-events:none;background:conic-gradient(from 90deg at 50% 50%,transparent 0deg,rgba(215,170,77,.025) 42deg,transparent 88deg,rgba(29,89,57,.045) 145deg,transparent 210deg,rgba(215,170,77,.02) 285deg,transparent 360deg);animation:luxeAurora 26s linear infinite;transform-origin:center}
@keyframes luxeAurora{to{transform:rotate(360deg)}}
.noise{opacity:.045!important;mix-blend-mode:soft-light!important}.scrollbar{height:2px!important;background:linear-gradient(90deg,#8f6422,#f2d47e,#d7aa4d)!important;box-shadow:0 0 20px rgba(215,170,77,.55)!important}
.nav{border-bottom:1px solid transparent}.nav.scrolled{background:rgba(2,9,6,.80)!important;border-bottom:1px solid rgba(215,170,77,.18)!important;backdrop-filter:blur(24px) saturate(1.12)!important}.nav:before{background:linear-gradient(180deg,rgba(2,8,6,.92),rgba(2,8,6,.40) 55%,transparent)!important}
.navin{min-height:92px!important}.brand{min-width:180px!important}.brandMark{width:180px!important;height:72px!important;background:linear-gradient(115deg,#8d611d 0%,#ffd979 18%,#ba7f20 38%,#f8d56c 58%,#8a5c19 78%,#e5b94f 100%)!important;background-size:220% 100%!important;animation:logoGoldSweep 7s ease-in-out infinite!important;filter:drop-shadow(0 0 14px rgba(215,170,77,.22))!important}

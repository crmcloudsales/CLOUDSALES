name: Build CloudSales 11-Language Catalogs
# Certified static localization build. No runtime machine translation.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/build_i18n_catalog_locale_20260903.mjs'
      - '.github/workflows/build-i18n-catalogs-20260903.yml'
permissions:
  contents: write
  id-token: write
concurrency:
  group: cloudsales-i18n-static-catalog-v5
  cancel-in-progress: true
jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        locale: [es, en, fr, it, pt-BR, de, ar-AE, ru, he, zh-CN, ja]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply semantic preservation guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/build_i18n_catalog_locale_20260903.mjs')
          s=p.read_text()
          old="function numbers(s){return [...s.matchAll(/(?:[$€£¥]\\s*)?\\d+(?:[.,]\\d+)?\\s*%?/g)].map(m=>m[0].replace(/\\s+/g,'')).sort()}\nfunction validatePreservation(source,target){const a=numbers(source),b=numbers(target);if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('numeric_preservation_failed: '+source.slice(0,80)+' => '+target.slice(0,80));for(const brand of ['CloudSales','Cloudy','AgentCloud','CloudCo','LISTIA','Stripe','PayPal','Binance'])if(source.includes(brand)&&!target.includes(brand))throw new Error('brand_preservation_failed_'+brand)}"
          new="function numericValues(s){return [...s.matchAll(/\\d+(?:[.,]\\d+)?/g)].map(m=>m[0].replace(',','.')).sort()}\nfunction currencyCodes(s){return [...s.matchAll(/\\b(?:USD|MXN|CAD|EUR|GBP|JPY|CNY|RMB|BRL|AED|ILS|RUB)\\b/g)].map(m=>m[0]).sort()}\nfunction validatePreservation(source,target){const a=numericValues(source),b=numericValues(target);if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('numeric_preservation_failed: '+source.slice(0,80)+' => '+target.slice(0,80));const ca=currencyCodes(source),cb=currencyCodes(target);if(JSON.stringify(ca)!==JSON.stringify(cb))throw new Error('currency_preservation_failed: '+source.slice(0,80)+' => '+target.slice(0,80));const pa=(source.match(/%/g)||[]).length,pb=(target.match(/%/g)||[]).length;if(pa!==pb)throw new Error('percent_preservation_failed: '+source.slice(0,80)+' => '+target.slice(0,80));if(!ca.length&&/[$€£¥]/.test(source)&&!/[$€£¥]/.test(target))throw new Error('currency_symbol_missing: '+source.slice(0,80)+' => '+target.slice(0,80));for(const brand of ['CloudSales','Cloudy','AgentCloud','CloudCo','LISTIA','Stripe','PayPal','Binance'])if(source.includes(brand)&&!target.includes(brand))throw new Error('brand_preservation_failed_'+brand)}"
          if old not in s: raise SystemExit('money guard marker not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Bound calls, refresh auth and parallelize batches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/build_i18n_catalog_locale_20260903.mjs')
          s=p.read_text()
          old_fetch="for(let attempt=1;attempt<=3;attempt++)try{const r=await fetch(ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+token,'x-cloudsales-build':'i18n','content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));"
          new_fetch="for(let attempt=1;attempt<=6;attempt++)try{token=await oidcToken();const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),105000);let r;try{r=await fetch(ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+token,'x-cloudsales-build':'i18n','content-type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})}finally{clearTimeout(timer)}const j=await r.json().catch(()=>({}));"
          if old_fetch not in s: raise SystemExit('fetch marker not found')
          s=s.replace('const token=await oidcToken();','let token=await oidcToken();',1)
          s=s.replace(old_fetch,new_fetch,1)
          old_parse="const obj=parseJson(j?.choices?.[0]?.message?.content||'');const tr=obj?.translations;if(!tr||typeof tr!=='object')throw new Error('invalid_json_shape');"
          new_parse="const raw=String(j?.choices?.[0]?.message?.content||'').trim();let tr=null;try{const obj=parseJson(raw);tr=obj?.translations}catch{}if((!tr||typeof tr!=='object')&&items.length===1&&raw){let plain=raw.replace(/^```(?:json)?\\s*/i,'').replace(/\\s*```$/,'').trim();if(!plain.startsWith('{')){plain=plain.replace(/^['\\\"]|['\\\"]$/g,'').trim();if(plain)tr={[items[0].id]:plain}}}if(!tr||typeof tr!=='object')throw new Error('invalid_json_shape');"
          if old_parse not in s: raise SystemExit('parse marker not found')
          s=s.replace(old_parse,new_parse,1)
          old_catch="}catch(e){if(attempt===3){if(items.length>1&&depth<5){const mid=Math.ceil(items.length/2);return Object.assign({},await translateBatch(items.slice(0,mid),surface,depth+1),await translateBatch(items.slice(mid),surface,depth+1))}throw e}await new Promise(r=>setTimeout(r,700*attempt))}return{}}"
          new_catch="}catch(e){const msg=String(e?.message||e);if(msg.startsWith('gateway_401_')){oidc={token:'',at:0}}if(attempt===6){if(items.length>1&&depth<8){const mid=Math.ceil(items.length/2);return Object.assign({},await translateBatch(items.slice(0,mid),surface,depth+1),await translateBatch(items.slice(mid),surface,depth+1))}throw e}await new Promise(r=>setTimeout(r,900*Math.min(attempt,4)))}return{}}"
          if old_catch not in s: raise SystemExit('retry marker not found')
          s=s.replace(old_catch,new_catch,1)
          old_batches="function batches(items){const out=[];let cur=[],chars=0;for(const x of items){const n=x.text.length;if(cur.length&&(cur.length>=28||chars+n>11500)){out.push(cur);cur=[];chars=0}cur.push(x);chars+=n}if(cur.length)out.push(cur);return out}"
          new_batches="function batches(items){const out=[];let cur=[],chars=0;for(const x of items){const n=x.text.length;if(cur.length&&(cur.length>=20||chars+n>8000)){out.push(cur);cur=[];chars=0}cur.push(x);chars+=n}if(cur.length)out.push(cur);return out}"
          if old_batches not in s: raise SystemExit('batch marker not found')
          s=s.replace(old_batches,new_batches,1)
          old_surface="async function translateSurface(list,surface){const result={},pending=[];for(const text of list){if(identityForTarget(text)){result[text]=text;continue}pending.push({id:idFor(text),text})}const bs=batches(pending);console.log(locale,surface,'sources',list.length,'identity',list.length-pending.length,'batches',bs.length);let done=0;for(const batch of bs){const tr=await translateBatch(batch,surface);for(const x of batch)result[x.text]=tr[x.id];done+=batch.length;console.log(locale,surface,'translated',done,'/',pending.length)}for(const s of list)if(typeof result[s]!=='string'||!result[s].trim())throw new Error('catalog_missing_'+surface+'_'+s.slice(0,60));return Object.fromEntries(Object.entries(result).sort(([a],[b])=>a.localeCompare(b)))}"
          new_surface="async function translateSurface(list,surface){const result={},pending=[];for(const text of list){if(identityForTarget(text)){result[text]=text;continue}pending.push({id:idFor(text),text})}const bs=batches(pending);console.log(locale,surface,'sources',list.length,'identity',list.length-pending.length,'batches',bs.length);let done=0,cursor=0;async function worker(){while(true){const i=cursor++;if(i>=bs.length)return;const batch=bs[i],tr=await translateBatch(batch,surface);for(const x of batch)result[x.text]=tr[x.id];done+=batch.length;console.log(locale,surface,'translated',done,'/',pending.length)}}await Promise.all(Array.from({length:Math.min(2,bs.length)},()=>worker()));for(const s of list)if(typeof result[s]!=='string'||!result[s].trim())throw new Error('catalog_missing_'+surface+'_'+s.slice(0,60));return Object.fromEntries(Object.entries(result).sort(([a],[b])=>a.localeCompare(b)))}"
          if old_surface not in s: raise SystemExit('surface marker not found')
          s=s.replace(old_surface,new_surface,1)
          p.write_text(s)
          PY
      - name: Generate ${{ matrix.locale }} static catalog
        env:
          LOCALE: ${{ matrix.locale }}
        run: node .github/scripts/build_i18n_catalog_locale_20260903.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: i18n-${{ matrix.locale }}
          path: build/i18n/${{ matrix.locale }}.json
          if-no-files-found: error
          retention-days: 1
  commit:
    needs: localize
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: i18n-*
          path: web/i18n/catalog-v1
          merge-multiple: true
      - name: Validate complete catalog set
        run: |
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const locales=['es','en','fr','it','pt-BR','de','ar-AE','ru','he','zh-CN','ja'];
          const manifest={version:'2026.09.03.2',generated_at:new Date().toISOString(),locales:{}};
          let expected=null;
          for(const lc of locales){
            const p=`web/i18n/catalog-v1/${lc}.json`;if(!fs.existsSync(p))throw Error('missing_'+lc);
            const raw=fs.readFileSync(p,'utf8'),j=JSON.parse(raw);
            if(j.locale!==lc||!j.commercial||!j.pwa)throw Error('invalid_'+lc);
            const c=Object.keys(j.commercial).length,w=Object.keys(j.pwa).length;
            if(c<250||w<100)throw Error(`coverage_too_small_${lc}_${c}_${w}`);
            if(!expected)expected={c,w};else if(c!==expected.c||w!==expected.w)throw Error(`count_mismatch_${lc}_${c}_${w}_${expected.c}_${expected.w}`);
            for(const [surface,obj] of [['commercial',j.commercial],['pwa',j.pwa]])for(const [k,v] of Object.entries(obj))if(!k.trim()||typeof v!=='string'||!v.trim())throw Error(`blank_${lc}_${surface}`);
            manifest.locales[lc]={commercial:c,pwa:w,sha256:crypto.createHash('sha256').update(raw).digest('hex')};
          }
          fs.writeFileSync('web/i18n/catalog-v1/manifest.json',JSON.stringify(manifest,null,2)+'\n');
          console.log(JSON.stringify(manifest,null,2));
          NODE
      - name: Commit certified static catalogs
        run: |
          git config user.name 'CloudSales I18N Build'
          git config user.email 'actions@users.noreply.github.com'
          git add web/i18n/catalog-v1
          if git diff --cached --quiet; then echo 'Catalogs already current'; exit 0; fi
          git commit -m 'feat(i18n): add complete static 11-language catalogs'
          git push origin HEAD:main

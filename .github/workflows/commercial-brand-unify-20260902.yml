name: CloudSales Commercial Brand Unify 2026-09-02
on:
  push:
    paths:
      - '.github/scripts/commercial_brand_unify_20260902.py'
      - '.github/triggers/commercial-brand-unify-20260902.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply commercial brand unification
        run: python3 .github/scripts/commercial_brand_unify_20260902.py
      - name: Validate JavaScript and guards
        run: |
          node --check web/commercial-brand-runtime-v2.js
          grep -q 'commercial-brand-runtime-v2.js?v=2026090206' web/commercial.html
          grep -q '/assets/cloudsales-logo-official-v2.png?v=2026090206' web/commercial.html
          grep -q 'Windows' web/commercial-brand-runtime-v2.js
          grep -q "<span>Web</span>" web/commercial-brand-runtime-v2.js
          grep -q 'Twenty' web/commercial-brand-runtime-v2.js
          grep -q 'VERSION="2026.09.02.6"' supabase/functions/cloudflare-site-brand-release/index.ts
          ! grep -Eqi '14[- ]?day( free)? trial|14 days free|14 d[ií]as( de prueba)? gratis' web/commercial.html
      - name: Commit unified commercial brand
        run: |
          if git diff --quiet; then echo 'No changes'; exit 0; fi
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web supabase/functions/cloudflare-site-brand-release/index.ts
          git commit -m 'fix(commercial): unify logo, PWA colors, CRM rail, devices and 7-day trial'
          git push origin HEAD:main

# one-time exact asset reconstruction
name: Meza exact image assets

on:
  push:
    paths:
      - '.github/workflows/meza-assets-build-once.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify exact Josefina and MEZA logo JPEGs
        shell: bash
        run: |
          set -euo pipefail
          echo "Josefina b64 chars: $(cat web/clients/meza/assets/build-src/josefina/*.b64 | wc -c) expected 33496"
          echo "Logo b64 chars: $(cat web/clients/meza/assets/build-src/logo/*.b64 | wc -c) expected 20036"
          cat web/clients/meza/assets/build-src/josefina/*.b64 | base64 --decode > web/clients/meza/assets/josefina-meza.jpg
          cat web/clients/meza/assets/build-src/logo/*.b64 | base64 --decode > web/clients/meza/assets/meza-logo.jpg
          echo "Josefina bytes: $(stat -c%s web/clients/meza/assets/josefina-meza.jpg) expected 25120"
          echo "Logo bytes: $(stat -c%s web/clients/meza/assets/meza-logo.jpg) expected 15026"
          sha256sum web/clients/meza/assets/josefina-meza.jpg web/clients/meza/assets/meza-logo.jpg
          file web/clients/meza/assets/josefina-meza.jpg
          file web/clients/meza/assets/meza-logo.jpg
          test "$(cat web/clients/meza/assets/build-src/josefina/*.b64 | wc -c)" = "33496"
          test "$(cat web/clients/meza/assets/build-src/logo/*.b64 | wc -c)" = "20036"
          echo 'e28dc8b7055a43d6bd446c0033e113d0ab554af19f507e302d14113f84f62cc2  web/clients/meza/assets/josefina-meza.jpg' | sha256sum -c -
          echo 'fdf708d2fb3e8f5b5c9da0649ba8ed9664ac8d9b7c148c9e101dcecb1356605d  web/clients/meza/assets/meza-logo.jpg' | sha256sum -c -
          rm -rf web/clients/meza/assets/build-src
      - name: Commit verified binaries
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cloudsales-release-bot'
          git config user.email 'crmcloudsales@gmail.com'
          git add -A web/clients/meza/assets
          git diff --cached --quiet && exit 0
          git commit -m 'fix(meza): publish verified Josefina and logo JPEG assets'
          git push origin HEAD:main

name: Build CloudSales PWA Icon

on:
  push:
    paths:
      - "scripts/build_cloudsales_pwa_icon.py"
      - "web/assets/cloudsales-isotipo-official-512.png"
      - ".github/workflows/build-cloudsales-pwa-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build icons
        run: python scripts/build_cloudsales_pwa_icon.py

      - name: Verify dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          for path, expected in [
              ('web/assets/cloudsales-app-icon-official-v2.png', (512, 512)),
              ('web/assets/cloudsales-app-icon-official-v2-192.png', (192, 192)),
          ]:
              with Image.open(path) as im:
                  assert im.size == expected, (path, im.size, expected)
                  print(path, im.size)
          PY

      - name: Commit generated icons
        run: |
          if git diff --quiet -- web/assets/cloudsales-app-icon-official-v2.png web/assets/cloudsales-app-icon-official-v2-192.png; then
            echo "Icons already up to date"
            exit 0
          fi
          git config user.name "cloudsales-build-bot"
          git config user.email "cloudsales-build-bot@users.noreply.github.com"
          git add web/assets/cloudsales-app-icon-official-v2.png web/assets/cloudsales-app-icon-official-v2-192.png
          git commit -m "build: center and reduce CloudSales PWA isotipo"
          git push

name: Build CloudSales PWA Icon

on:
  push:
    paths:
      - "scripts/build_cloudsales_pwa_icon.py"
      - ".github/workflows/build-cloudsales-pwa-icon.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-icon:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Preserve stable official artwork
        run: |
          if [ ! -f web/assets/cloudsales-app-icon-source-v2.png ]; then
            cp web/assets/cloudsales-app-icon-official-v2.png web/assets/cloudsales-app-icon-source-v2.png
          fi

      - name: Build icons
        run: python scripts/build_cloudsales_pwa_icon.py

      - name: Verify icon geometry
        run: |
          python - <<'PY'
          from PIL import Image
          BG=(36,9,60)
          for path, expected in [
              ('web/assets/cloudsales-app-icon-official-v2.png', (512, 512)),
              ('web/assets/cloudsales-app-icon-official-v2-192.png', (192, 192)),
          ]:
              with Image.open(path).convert('RGB') as im:
                  assert im.size == expected, (path, im.size, expected)
                  assert im.getpixel((0,0)) == BG, (path, im.getpixel((0,0)))
                  assert im.getpixel((im.width-1,im.height-1)) == BG
                  print(path, im.size, 'background', im.getpixel((0,0)))
          PY

      - name: Commit generated icons
        run: |
          if git diff --quiet -- web/assets/cloudsales-app-icon-official-v2.png web/assets/cloudsales-app-icon-official-v2-192.png && git ls-files --error-unmatch web/assets/cloudsales-app-icon-source-v2.png >/dev/null 2>&1; then
            echo "Icons already up to date"
            exit 0
          fi
          git config user.name "cloudsales-build-bot"
          git config user.email "cloudsales-build-bot@users.noreply.github.com"
          git add web/assets/cloudsales-app-icon-source-v2.png web/assets/cloudsales-app-icon-official-v2.png web/assets/cloudsales-app-icon-official-v2-192.png
          git commit -m "build: center and reduce CloudSales PWA isotipo"
          git push

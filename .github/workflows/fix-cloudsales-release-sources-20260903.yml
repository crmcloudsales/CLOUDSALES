name: Fix CloudSales Release Sources 2026-09-03
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_cloudsales_release_sources_20260903.py'
      - '.github/workflows/fix-cloudsales-release-sources-20260903.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix release source mapping and permanent smoke guards
        run: python3 .github/scripts/fix_cloudsales_release_sources_20260903.py
      - name: Validate release source
        run: |
          grep -Fq "'/crm':'commercial.html'" supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'VERSION="2026.09.03.5"' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'no_obsolete_14_day_trial' supabase/functions/cloudflare-site-brand-release/index.ts
          grep -Fq 'root_premium_truth' supabase/functions/cloudflare-site-brand-release/index.ts
      - name: Commit release source and permanent finalizer alignment
        run: |
          if git diff --quiet -- supabase/functions/cloudflare-site-brand-release/index.ts .github/scripts/finalize_cloudsales_commercial_20260903.py; then exit 0; fi
          git config user.name 'CloudSales Release Guard'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/cloudflare-site-brand-release/index.ts .github/scripts/finalize_cloudsales_commercial_20260903.py
          git commit -m 'fix(release): use canonical GitHub sources for all CloudSales routes'
          git push origin HEAD:main

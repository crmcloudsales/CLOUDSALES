name: Domains Security + Email v1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/domains-security-email-v1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Patch storefront
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('web/commercial/domains-v2.html'); s=p.read_text(); mark='cs-domains-whatsapp-gate-v1'
          s=s.replace('Desde US$49/mes →','Desde US$47/mes →')
          old='Correo profesional: después de registrar el dominio podrás conectar un proveedor de correo como Google Workspace. El correo profesional no está incluido gratis por Google y cualquier suscripción del proveedor se paga por separado.'
          new='Correo profesional: podrás usar direcciones como hola@tunegocio.com sin contratar STARTER, PRO o PREMIUM. Recibe en tu Gmail/Outlook actual y administra el envío manual desde CloudSales Domains. Google Workspace o Microsoft 365 serán opciones adicionales de pago si quieres un buzón completo en esas plataformas.'
          s=s.replace(old,new)
          section='''<section class="card" id="professional-email"><div class="kicker">CORREO PROFESIONAL</div><h2 style="font-size:32px;letter-spacing:-.045em;margin:10px 0 8px">Tu email con tu dominio, sin obligarte a pagar un plan.</h2><p class="note" style="font-size:14px">Usa una dirección como <b style="color:#fff">hola@tunegocio.com</b>. Tu compra dará acceso a CloudSales Domains para administrar dominio, sitio y correo aunque no tengas STARTER, PRO o PREMIUM.</p><div class="steps" style="margin:20px 0 0"><div class="step"><div class="n">1</div><b>Recibe donde ya trabajas</b><p>El correo entrante puede reenviarse a tu Gmail, Outlook u otra dirección verificada mediante Cloudflare Email Routing.</p></div><div class="step"><div class="n">2</div><b>Envía como tu negocio</b><p>El envío manual se hará desde CloudSales Domains mediante CLOUDCO EMAIL ENGINE. Nunca exponemos credenciales SMTP de infraestructura.</p></div><div class="step"><div class="n">3</div><b>Buzón completo opcional</b><p>Si prefieres Gmail o Outlook empresarial nativo, conecta Google Workspace o Microsoft 365 y paga ese proveedor por separado.</p></div></div><p class="note">Email manual uno-a-uno: sin cargo de WORKS. Automatizaciones y envíos masivos se cobran según CloudSales WORKS.</p></section>'''
          if 'id="professional-email"' not in s: s=s.replace('<details class="card support">',section+'<details class="card support">',1)
          css='''<style id="cs-domains-whatsapp-gate-v1-css">#csDomainWa{position:fixed;right:18px;bottom:18px;z-index:2147482000;border:0;border-radius:999px;background:#25D366;color:#fff;font:900 15px Inter,system-ui,sans-serif;padding:14px 18px;box-shadow:0 18px 50px #0009;cursor:pointer}.csWaOverlay{position:fixed;inset:0;z-index:2147482001;background:#000b;display:none;align-items:flex-end;justify-content:flex-end;padding:18px}.csWaOverlay.open{display:flex}.csWaGate{width:min(410px,calc(100vw - 24px));background:#0e0e15;border:1px solid #343442;border-radius:24px;overflow:hidden;box-shadow:0 30px 100px #000c}.csWaHead{background:#25D366;padding:17px;color:#fff;display:flex;justify-content:space-between;gap:12px}.csWaHead b{font-size:20px}.csWaHead span{display:block;font-size:11px;margin-top:3px}.csWaClose{border:0;background:#0002;color:#fff;width:34px;height:34px;border-radius:50%;font-size:22px}.csWaBody{padding:16px}.csWaBody .input{margin-bottom:9px}.csWaConsent{display:flex;gap:8px;font-size:10px;color:#9e9ba8;line-height:1.45;margin:9px 0}.csWaSubmit{width:100%;border:0;border-radius:999px;background:#25D366;color:#fff;font-weight:950;padding:14px}.csWaStatus{font-size:11px;color:#ffadb7;margin-top:9px}.csWaSecurity{font-size:9px;color:#777586;margin-top:9px;line-height:1.45}@media(max-width:620px){#csDomainWa{right:12px;bottom:12px}.csWaOverlay{padding:12px}.csWaGate{width:100%}}</style>'''
          html='''<button id="csDomainWa" type="button">WhatsApp</button><div id="csWaOverlay" class="csWaOverlay" aria-hidden="true"><section class="csWaGate" role="dialog"><div class="csWaHead"><div><b>WhatsApp CloudSales</b><span>Primero validamos tus datos para proteger la solicitud.</span></div><button id="csWaClose" class="csWaClose" type="button">×</button></div><form id="csWaForm" class="csWaBody"><input id="csWaName" class="input" placeholder="Nombre completo" maxlength="180" required><input id="csWaPhone" class="input" placeholder="WhatsApp / Teléfono" maxlength="80" required><input id="csWaEmail" class="input" type="email" placeholder="Correo electrónico" maxlength="320" required><label class="csWaConsent"><input id="csWaMarketing" type="checkbox"><span>Acepto recibir promociones y novedades de CloudSales. Es opcional.</span></label><input id="csWaWebsite" class="hp" tabindex="-1" autocomplete="off"><button id="csWaSubmit" class="csWaSubmit" type="submit">CONTINUAR A WHATSAPP</button><div id="csWaStatus" class="csWaStatus"></div><div class="csWaSecurity">Validación server-side, honeypot, control de origen y rate limiting. Esta página no abre WhatsApp hasta aceptar el formulario.</div></form></section></div>'''
          js=r'''<script id="cs-domains-whatsapp-gate-v1">(()=>{'use strict';const PHONE='529842385977',O=document.getElementById('csWaOverlay'),F=document.getElementById('csWaForm'),B=document.getElementById('csDomainWa'),C=document.getElementById('csWaClose'),S=document.getElementById('csWaSubmit'),M=document.getElementById('csWaStatus');let T=0;const V='cs_public_visitor_v1';function visitor(){let v=localStorage.getItem(V);if(!v){v='v_'+crypto.randomUUID().replaceAll('-','')+Date.now().toString(36);localStorage.setItem(V,v)}return v}function norm(v){return String(v||'').trim().toLowerCase().replace(/^https?:\/\//,'').replace(/^www\./,'').split('/')[0].replace(/\.$/,'')}function attr(){const u=new URL(location.href);return{utm_source:u.searchParams.get('utm_source'),utm_medium:u.searchParams.get('utm_medium'),utm_campaign:u.searchParams.get('utm_campaign'),utm_content:u.searchParams.get('utm_content'),utm_term:u.searchParams.get('utm_term'),fbclid:u.searchParams.get('fbclid'),gclid:u.searchParams.get('gclid'),referrer:document.referrer}}function open(){T=Date.now();for(const [a,b] of [['name','csWaName'],['phone','csWaPhone'],['email','csWaEmail']]){const x=document.getElementById(a),y=document.getElementById(b);if(x?.value)y.value=x.value}O.classList.add('open');O.setAttribute('aria-hidden','false')}function close(){O.classList.remove('open');O.setAttribute('aria-hidden','true')}B.onclick=open;C.onclick=close;O.onclick=e=>{if(e.target===O)close()};F.onsubmit=async e=>{e.preventDefault();M.textContent='';const n=document.getElementById('csWaName').value.trim(),p=document.getElementById('csWaPhone').value.trim(),em=document.getElementById('csWaEmail').value.trim(),h=document.getElementById('csWaWebsite').value;if(n.length<2||p.replace(/\D/g,'').length<8||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){M.textContent='Completa nombre, teléfono y email válido.';return}if(Date.now()-T<900){M.textContent='Espera un momento e intenta nuevamente.';return}S.disabled=true;S.textContent='VALIDANDO…';try{const r=await fetch('/api/domain-lead',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({visitor_id:visitor(),name:n,phone:p,email:em,domain_name:norm(document.getElementById('domain')?.value),intent_stage:'whatsapp_gate',marketing_consent:document.getElementById('csWaMarketing').checked,website:h,attribution:attr(),metadata:{channel:'whatsapp',gate:'required_contact_form',started_at:T}})}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error();const dn=norm(document.getElementById('domain')?.value),txt='Hola CloudSales. Dejé mis datos en la página de dominios y quiero información'+(dn?' sobre '+dn:'.');window.open('https://api.whatsapp.com/send?phone='+PHONE+'&text='+encodeURIComponent(txt),'_blank','noopener');close()}catch{M.textContent='No pudimos validar tus datos. Intenta nuevamente.'}finally{S.disabled=false;S.textContent='CONTINUAR A WHATSAPP'}}})();</script>'''
          if mark not in s:
              s=s.replace('</head>',css+'</head>',1); s=s.replace('</body>',html+js+'</body>',1)
          assert s.count('id="csDomainWa"')==1 and '529842385977' in s and 'Desde US$47/mes' in s and 'id="professional-email"' in s
          p.write_text(s)
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'CloudSales Automation'
          git config user.email 'info@cloudsales.app'
          git add web/commercial/domains-v2.html
          git commit -m 'feat(domains): secure WhatsApp and professional email guidance'
          git push origin HEAD:main

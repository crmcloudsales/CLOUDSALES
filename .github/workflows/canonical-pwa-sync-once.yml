name: Sync Canonical PWA Once

on:
  push:
    paths:
      - ".github/workflows/canonical-pwa-sync-once.yml"

permissions:
  contents: write

# one-time canonical alignment trigger: 2026-09-01
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align canonical PWA sources
        run: |
          python - <<'PY'
          from pathlib import Path

          pwa = Path('web/pwa.html')
          s = pwa.read_text()
          s = s.replace('Basic<br><b>$49</b>', 'Basic<br><b>$47</b>')
          s = s.replace('Premium<br><b>$197</b>', 'Premium<br><b>$147</b>')
          if 'Basic<br><b>$49</b>' in s or 'Premium<br><b>$197</b>' in s:
              raise SystemExit('legacy PWA pricing remains')
          if 'Basic<br><b>$47</b>' not in s or 'Pro<br><b>$97</b>' not in s or 'Premium<br><b>$147</b>' not in s:
              raise SystemExit('canonical pricing guard failed')
          pwa.write_text(s)

          rel = Path('supabase/functions/cloudflare-pwa-brand-release/index.ts')
          r = rel.read_text()
          r = r.replace('const VERSION="2026.08.30.1";', 'const VERSION="2026.09.01.2";')
          anchor='  "/contact-profile-runtime-v1.js",\n];'
          wanted=[
            '  "/dashboard-runtime-v3.js",',
            '  "/sales-analytics-runtime-v1.js",',
            '  "/native-shell-runtime-v1.js",',
            '  "/workspace-polish-runtime-v1.js",',
          ]
          if '/workspace-polish-runtime-v1.js' not in r:
              if anchor not in r:
                  raise SystemExit('PAGE_RUNTIMES anchor missing')
              r=r.replace(anchor,'  "/contact-profile-runtime-v1.js",\n'+'\n'.join(wanted)+'\n];')
          for x in ['2026.09.01.2','/dashboard-runtime-v3.js','/sales-analytics-runtime-v1.js','/native-shell-runtime-v1.js','/workspace-polish-runtime-v1.js']:
              if x not in r:
                  raise SystemExit('release guard missing '+x)
          rel.write_text(r)
          PY
      - name: Syntax and source guards
        run: |
          node --check web/dashboard-runtime-v3.js
          node --check web/sales-analytics-runtime-v1.js
          node --check web/native-shell-runtime-v1.js
          node --check web/workspace-polish-runtime-v1.js
          grep -q "cloudsales-pwa-2026.09.01.1" web/sw.js
          grep -q 'Basic<br><b>$47</b>' web/pwa.html
          grep -q 'Premium<br><b>$147</b>' web/pwa.html
          grep -q '/workspace-polish-runtime-v1.js' supabase/functions/cloudflare-pwa-brand-release/index.ts
      - name: Commit canonical alignment
        run: |
          if git diff --quiet; then
            echo "Canonical sources already aligned"
            exit 0
          fi
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add web/pwa.html supabase/functions/cloudflare-pwa-brand-release/index.ts
          git commit -m "chore(pwa): align canonical release with live runtime stack"
          git push origin HEAD:main

name: Publish uploaded CloudSales icon v6

on:
  push:
    paths:
      - '.github/workflows/cloudsales-official-icon-v5-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cloudsales-official-icon-v6
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore uploaded icon and update PWA references
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          encoded=''.join(Path(f'web/icon-v6-enc/{i:02}.b64').read_text() for i in range(8))
          encrypted=base64.b64decode(encoded)
          seed=b'cloudsales-icon-v6'
          key=bytearray()
          for i in range((len(encrypted)+31)//32):
              key.extend(hashlib.sha256(seed+i.to_bytes(4,'big')).digest())
          original=bytes(a^b for a,b in zip(encrypted,key))
          expected='7a1d331bc7f9d13c1cf4a1a5da3db59b28f4ff7676d88f4963d37f3ac8990b25'
          actual=hashlib.sha256(original).hexdigest()
          if actual != expected:
              raise SystemExit(f'uploaded icon checksum mismatch: {actual}')
          Path('/tmp/cloudsales-official-icon.webp').write_bytes(original)
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          convert /tmp/cloudsales-official-icon.webp -resize 512x512 web/cloudsales-app-icon-official-v6.png
          convert /tmp/cloudsales-official-icon.webp -resize 192x192 web/cloudsales-app-icon-official-v6-192.png
          convert /tmp/cloudsales-official-icon.webp -resize 180x180 web/cloudsales-app-icon-official-v6-180.png
          convert /tmp/cloudsales-official-icon.webp -resize 64x64 web/cloudsales-app-icon-official-v6-64.png
          convert /tmp/cloudsales-official-icon.webp -resize 32x32 web/cloudsales-app-icon-official-v6-32.png

          mkdir -p web/assets
          cp web/cloudsales-app-icon-official-v6.png web/assets/cloudsales-app-icon-official-v6.png
          cp web/cloudsales-app-icon-official-v6-192.png web/assets/cloudsales-app-icon-official-v6-192.png
          cp web/cloudsales-app-icon-official-v6-180.png web/assets/cloudsales-app-icon-official-v6-180.png
          cp web/cloudsales-app-icon-official-v6-64.png web/assets/cloudsales-app-icon-official-v6-64.png
          cp web/cloudsales-app-icon-official-v6-32.png web/assets/cloudsales-app-icon-official-v6-32.png

          cp web/cloudsales-app-icon-official-v6-192.png web/icon-192.png
          cp web/cloudsales-app-icon-official-v6.png web/icon-512.png
          cp web/cloudsales-app-icon-official-v6-180.png web/apple-touch-icon.png
          cp web/cloudsales-app-icon-official-v6-64.png web/favicon.png

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          VERSION='202609041814'
          root=Path('web')
          exts={'.html','.js','.mjs','.json','.webmanifest','.css','.txt'}

          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in exts:
                  continue
              try:
                  s=p.read_text()
              except UnicodeDecodeError:
                  continue
              n=(s.replace('cloudsales-app-icon-official-v4','cloudsales-app-icon-official-v6')
                   .replace('cloudsales-app-icon-official-v5','cloudsales-app-icon-official-v6'))
              if n != s:
                  p.write_text(n)

          manifest=Path('web/manifest.webmanifest')
          d=json.loads(manifest.read_text())
          d['icons']=[
            {'src':f'/cloudsales-app-icon-official-v6-192.png?v={VERSION}','sizes':'192x192','type':'image/png','purpose':'any'},
            {'src':f'/cloudsales-app-icon-official-v6.png?v={VERSION}','sizes':'512x512','type':'image/png','purpose':'any'},
            {'src':f'/cloudsales-app-icon-official-v6.png?v={VERSION}','sizes':'512x512','type':'image/png','purpose':'maskable'}
          ]
          manifest.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')

          pwa=Path('web/pwa.html')
          s=pwa.read_text()
          icon=f'<link rel="icon" type="image/png" sizes="64x64" href="/cloudsales-app-icon-official-v6-64.png?v={VERSION}">'
          apple=f'<link rel="apple-touch-icon" sizes="180x180" href="/cloudsales-app-icon-official-v6-180.png?v={VERSION}">'
          if re.search(r'<link rel="icon"[^>]*>',s):
              s=re.sub(r'<link rel="icon"[^>]*>',icon,s,count=1)
          else:
              s=s.replace('</head>',icon+'\n</head>',1)
          if re.search(r'<link rel="apple-touch-icon"[^>]*>',s):
              s=re.sub(r'<link rel="apple-touch-icon"[^>]*>',apple,s,count=1)
          else:
              s=s.replace('</head>',apple+'\n</head>',1)
          pwa.write_text(s)

          commercial=Path('web/commercial.html')
          if commercial.exists():
              s=commercial.read_text()
              icon=f'<link rel="icon" type="image/png" sizes="64x64" href="/assets/cloudsales-app-icon-official-v6-64.png?v={VERSION}">'
              apple=f'<link rel="apple-touch-icon" sizes="180x180" href="/assets/cloudsales-app-icon-official-v6-180.png?v={VERSION}">'
              if re.search(r'<link rel="icon"[^>]*>',s):
                  s=re.sub(r'<link rel="icon"[^>]*>',icon,s,count=1)
              else:
                  s=s.replace('</head>',icon+'\n</head>',1)
              if re.search(r'<link rel="apple-touch-icon"[^>]*>',s):
                  s=re.sub(r'<link rel="apple-touch-icon"[^>]*>',apple,s,count=1)
              else:
                  s=s.replace('</head>',apple+'\n</head>',1)
              commercial.write_text(s)

          sw=Path('web/sw.js')
          s=sw.read_text()
          s=re.sub(r"const CACHE='[^']+';", "const CACHE='cloudsales-pwa-2026.09.04.4-official-icon-v6';", s, count=1)
          for old,new in [
              ('/cloudsales-app-icon-official-v4-192.png','/cloudsales-app-icon-official-v6-192.png'),
              ('/cloudsales-app-icon-official-v4.png','/cloudsales-app-icon-official-v6.png'),
              ('/cloudsales-app-icon-official-v5-192.png','/cloudsales-app-icon-official-v6-192.png'),
              ('/cloudsales-app-icon-official-v5.png','/cloudsales-app-icon-official-v6.png')]:
              s=s.replace(old,new)
          sw.write_text(s)
          PY

          test "$(identify -format '%wx%h' web/cloudsales-app-icon-official-v6.png)" = '512x512'
          test "$(identify -format '%wx%h' web/cloudsales-app-icon-official-v6-192.png)" = '192x192'
          test "$(identify -format '%wx%h' web/cloudsales-app-icon-official-v6-180.png)" = '180x180'
          test "$(identify -format '%wx%h' web/cloudsales-app-icon-official-v6-64.png)" = '64x64'
          test "$(identify -format '%wx%h' web/cloudsales-app-icon-official-v6-32.png)" = '32x32'
          grep -q 'cloudsales-app-icon-official-v6' web/manifest.webmanifest
          grep -q 'cloudsales-app-icon-official-v6' web/pwa.html
          grep -q 'cloudsales-pwa-2026.09.04.4-official-icon-v6' web/sw.js

      - name: Commit official icon update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cloudsales-release-bot'
          git config user.email 'crmcloudsales@gmail.com'
          git add -A web
          git diff --cached --quiet && exit 0
          git commit -m 'fix(brand): use uploaded official CloudSales icon for PWA'
          git pull --rebase origin main
          git push origin HEAD:main

name: CloudSales Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudsales-runtime-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudsales-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check CloudSales browser and Worker syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check CloudSales JSON assets
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "Parsing $file"
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find web -type f -name '*.json' -print0)

      - name: Check production branding, mobile operations, team claims and Meta controls
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          for(const p of [
            'web/assets/cloudsales-app-icon-official-v2.png',
            'web/assets/cloudsales-app-icon-official-v2-192.png',
            'web/assets/cloudsales-logo-official-v2.png'
          ]) if(!fs.existsSync(p)||fs.statSync(p).size<1000) throw new Error('missing_official_asset_'+p);
          const manifest=JSON.parse(fs.readFileSync('web/manifest.webmanifest','utf8'));
          if(manifest.id!=='/cloudsales-app-v2') throw new Error('manifest_identity_not_rotated');
          const src=(manifest.icons||[]).map(x=>String(x.src||''));
          if(!src.some(x=>x.includes('/cloudsales-app-icon-official-v2-192.png'))) throw new Error('manifest_missing_exact_192');
          if(!src.some(x=>x.includes('/cloudsales-app-icon-official-v2.png'))) throw new Error('manifest_missing_exact_512');
          if(src.some(x=>/icon\.svg/i.test(x))) throw new Error('manifest_uses_legacy_svg');
          const installer=fs.readFileSync('web/install.js','utf8');
          for(const x of ['beforeinstallprompt','/cloudsales-app-icon-official-v2.png','promptInstall']) if(!installer.includes(x)) throw new Error('installer_missing_'+x);
          const auth=fs.readFileSync('web/auth-runtime-v2.js','utf8');
          for(const x of ['claim-organization','cs_pending_claim','claimPending','cs_org']) if(!auth.includes(x)) throw new Error('team_claim_missing_'+x);
          const ops=fs.readFileSync('web/app-runtime-v14.js','utf8');
          for(const x of ['Operational Center','tenant-ops-api','renderMarketingOps','opportunity.move']) if(!ops.includes(x)) throw new Error('mobile_ops_missing_'+x);
          const meta=fs.readFileSync('web/meta-runtime-v1.js','utf8');
          for(const x of ['Meta Ads','ads.meta.accounts','ads.meta.sync','ads.meta.pause','ads.meta.resume','ads.meta.budget','ads.meta.create_campaign','presupuesto REAL']) if(!meta.includes(x)) throw new Error('meta_runtime_missing_'+x);
          const core=fs.readFileSync('supabase/functions/cloudy-core-command/index.ts','utf8');
          for(const x of ['ads.meta.accounts','ads.meta.account.select','ads.meta.sync','ads.meta.pause','ads.meta.resume','ads.meta.budget','ads.meta.create_campaign','service_read_secret','budget_sync_status: "confirmed"','meta_daily_budget_confirmation_failed']) if(!core.includes(x)) throw new Error('meta_adapter_missing_'+x);
          if(!core.includes('owner_or_admin_required')) throw new Error('meta_spend_role_guard_missing');
          const claim=fs.readFileSync('supabase/functions/claim-organization/index.ts','utf8');
          for(const x of ['organization_owner_already_assigned','requestedRole','admin','operator']) if(!claim.includes(x)) throw new Error('claim_function_missing_'+x);
          const pwaRelease=fs.readFileSync('supabase/functions/cloudflare-pwa-brand-release/index.ts','utf8');
          for(const x of ['cloudsales-pwa-v27','auth-runtime-v2.js','app-runtime-v14.js','meta-runtime-v1.js','meta_runtime_loaded','exact_logo_bytes']) if(!pwaRelease.includes(x)) throw new Error('pwa_release_missing_'+x);
          const siteRelease=fs.readFileSync('supabase/functions/cloudflare-site-brand-release/index.ts','utf8');
          for(const x of ['cloudsales-site-v16','cloudsales-logo-official-v2.png','cloudsales-favicon-official-v2.png','all_commercial_routes_branded','exact_logo_bytes']) if(!siteRelease.includes(x)) throw new Error('site_release_missing_'+x);
          console.log('CloudSales mobile operations/team claim/Meta control invariants OK');
          NODE

      - name: Build runtime freeze and polling audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const observers=[],intervals=[],fast=[],serverIntervals=[];
          function walk(dir,kind){
            if(!fs.existsSync(dir))return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,e.name);
              if(e.isDirectory())walk(p,kind);
              else if(e.isFile()&&(kind==='web'?/\.(?:js|mjs)$/.test(p):/\.ts$/.test(p))){
                const s=fs.readFileSync(p,'utf8');
                if(kind==='web'){
                  const direct=/\.observe\s*\(\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,1200}?childList\s*:\s*true/gs;
                  const fallback=/\.observe\s*\(\s*[^,;]{0,220}\|\|\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,1200}?childList\s*:\s*true/gs;
                  if(direct.test(s)||fallback.test(s))observers.push(p);
                }
                const re=/setInterval\s*\([\s\S]{0,700}?,\s*(\d{1,7})\s*\)/g;
                let m;while((m=re.exec(s))){
                  const ms=Number(m[1]),line=s.slice(0,m.index).split(/\n/).length,entry=`${p}:${line}: ${ms}ms`;
                  if(kind==='web'){intervals.push(entry);if(ms<3000)fast.push(entry)}else serverIntervals.push(entry);
                }
              }
            }
          }
          walk('web','web'); walk('supabase/functions','server');
          fs.writeFileSync('cloudsales-global-observers.txt',observers.join('\n')+(observers.length?'\n':''));
          fs.writeFileSync('cloudsales-intervals.txt',intervals.join('\n')+(intervals.length?'\n':''));
          fs.writeFileSync('cloudsales-fast-polling.txt',fast.join('\n')+(fast.length?'\n':''));
          fs.writeFileSync('cloudsales-server-intervals.txt',serverIntervals.join('\n')+(serverIntervals.length?'\n':''));
          for(const p of observers)console.log('Unsafe global childList MutationObserver:',p);
          for(const p of fast)console.log('High-frequency setInterval:',p);
          for(const p of serverIntervals)console.log('Persistent timer in Supabase Edge Function:',p);
          NODE

      - name: Upload CloudSales runtime audit
        uses: actions/upload-artifact@v4
        with:
          name: cloudsales-runtime-audit
          path: |
            cloudsales-global-observers.txt
            cloudsales-intervals.txt
            cloudsales-fast-polling.txt
            cloudsales-server-intervals.txt
          if-no-files-found: error
          retention-days: 2

      - name: Reject runtime regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -s cloudsales-global-observers.txt
          test ! -s cloudsales-fast-polling.txt
          test ! -s cloudsales-server-intervals.txt

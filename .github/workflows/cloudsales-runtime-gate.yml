name: CloudSales Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudsales-runtime-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudsales-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check browser and Worker syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check JSON assets
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find web -type f -name '*.json' -print0)

      - name: Check CloudSales product invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const requireText=(text,items,prefix)=>{for(const x of items)if(!text.includes(x))throw new Error(prefix+'_'+x)};

          for(const p of [
            'web/assets/cloudsales-app-icon-official-v2.png',
            'web/assets/cloudsales-app-icon-official-v2-192.png',
            'web/assets/cloudsales-logo-official-v2.png'
          ]) if(!fs.existsSync(p)||fs.statSync(p).size<1000) throw new Error('missing_official_asset_'+p);

          const manifest=JSON.parse(read('web/manifest.webmanifest'));
          if(manifest.id!=='/cloudsales-app-v2')throw new Error('manifest_identity_changed');
          const iconSrc=(manifest.icons||[]).map(x=>String(x.src||''));
          if(!iconSrc.some(x=>x.includes('/cloudsales-app-icon-official-v2-192.png')))throw new Error('manifest_missing_192');
          if(!iconSrc.some(x=>x.includes('/cloudsales-app-icon-official-v2.png')))throw new Error('manifest_missing_512');
          if(iconSrc.some(x=>/icon\.svg/i.test(x)))throw new Error('manifest_legacy_svg');

          const installer=read('web/install.js');
          requireText(installer,['beforeinstallprompt','/cloudsales-app-icon-official-v2.png','promptInstall'],'installer_missing');

          const auth=read('web/auth-runtime-v2.js');
          requireText(auth,['claim-organization','cs_pending_claim','claimPending','authorize_email','signup_confirmation','signup_confirmation_resend','signupEmailNotice','un único correo de confirmación'],'auth_missing');

          const ops=read('web/app-runtime-v14.js');
          requireText(ops,['Operational Center','tenant-ops-api','renderMarketingOps','opportunity.move'],'ops_missing');

          const meta=read('web/meta-runtime-v1.js');
          requireText(meta,['Meta Ads','ads.meta.platform_status','ads.meta.sync','ads.meta.budget','ads.meta.create_campaign',"META_PROVIDER='meta_ads'", "META_FN='cloudflare-pwa-release-v10'"],'meta_missing');
          const metaCmd=read('supabase/functions/meta-ads-command/index.ts');
          requireText(metaCmd,['const PROVIDER="meta_ads"','meta_daily_budget_confirmation_failed','meta_campaign_status_confirmation_failed','payment_card_data_not_allowed','owner_or_admin_required'],'meta_backend_missing');

          const cloudy=read('web/cloudy-runtime-v3.js');
          requireText(cloudy,['MediaRecorder','getUserMedia','requestAnimationFrame','cloudy-voice?mode=transcribe','cloudy-voice?mode=tts','SILENCE_MS','cs_cloudy_session'],'cloudy_missing');
          if(cloudy.includes('SpeechRecognition')||cloudy.includes('webkitSpeechRecognition'))throw new Error('browser_speech_recognition_forbidden');
          if(/setInterval\s*\(/.test(cloudy))throw new Error('cloudy_persistent_polling_forbidden');

          const cloudyChat=read('supabase/functions/cloudy-chat/index.ts');
          requireText(cloudyChat,['organization_id: organizationId','Continue the user\'s conversation','nvidia-nim','chooseAgent','cloudy_agents'],'cloudy_chat_missing');
          const orchestrator=read('supabase/functions/cloudy-orchestrator/index.ts');
          requireText(orchestrator,['VIEWER_CORE','write_capable !== true','cloudy_messages','ai_route_models','tool_calls','requested_via: "cloudy-orchestrator"'],'orchestrator_missing');
          const voice=read('supabase/functions/cloudy-voice/index.ts');
          requireText(voice,['@cf/openai/whisper','@cf/myshell-ai/melotts','mode==="transcribe"','mode==="tts"','organization_members'],'voice_missing');

          const works=read('web/works-runtime-v1.js');
          requireText(works,['Works · Trabajos','works.snapshot','Cloudy estuvo','Media spend','US$'],'works_missing');
          const workspace=read('supabase/functions/workspace-api/index.ts');
          requireText(workspace,['works.snapshot','work_catalog','work_ledger','month_usd','Media spend is billed directly'],'workspace_works_missing');

          const google=read('supabase/functions/google-ads-command/index.ts');
          requireText(google,['VERSION="v25"','customers:listAccessibleCustomers','developer-token','login-customer-id','googleAds:search','campaignBudgets:mutate','campaigns:mutate','payment_card_data_not_allowed','owner_or_admin_required','google_daily_budget_confirmation_failed'],'google_missing');
          if(!google.includes('status:"PAUSED"'))throw new Error('google_campaign_create_not_paused');

          const adspend=read('web/ad-spend-runtime-v1.js');
          requireText(adspend,['Ad Spend & Billing','ads.google.platform_status','ads.google.sync','ads.google.budget','ads.google.create_campaign','Administrar método de pago en Google','Abrir facturación de Meta'],'adspend_missing');
          if(/<input[^>]+(?:card|pan|cvc|cvv|expir|security.?code)/i.test(adspend))throw new Error('payment_card_input_forbidden');

          const claim=read('supabase/functions/claim-organization/index.ts');
          requireText(claim,['organization_owner_already_assigned','requestedRole','admin','operator'],'claim_missing');

          const controller=read('supabase/functions/cloudflare-pwa-brand-release/index.ts');
          const sw=read('web/sw.js');
          const service=controller.match(/const SERVICE="(cloudsales-pwa-v\d+)";/)?.[1];
          const version=controller.match(/const VERSION="([0-9]{4}\.[0-9]{2}\.[0-9]{2}\.[0-9]+)";/)?.[1];
          const command=controller.match(/const COMMAND="([^"]+)";/)?.[1];
          if(!service||!version||!command)throw new Error('release_metadata_missing');
          if(!sw.includes(`const CACHE='cloudsales-pwa-${version}'`))throw new Error('service_worker_release_mismatch');
          requireText(controller,['source_commit','/auth-runtime-v2.js','/app-runtime-v14.js','/meta-runtime-v1.js','/cloudy-runtime-v3.js','/works-runtime-v1.js','/ad-spend-runtime-v1.js','exact_logo_visible','exact_favicon'],'pwa_controller_missing');
          if(service==='cloudsales-pwa-v31'){
            requireText(controller,['auth_explicit_email','signup_confirmation_resend','signupEmailNotice','cloudsales.pwa.auth_v31.promoted'],'v31_auth_release_missing');
          }
          console.log(`CloudSales runtime invariants OK: ${service} ${version} ${command}`);
          NODE

      - name: Build freeze and polling audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const observers=[],intervals=[],fast=[],serverIntervals=[];
          function walk(dir,kind){
            if(!fs.existsSync(dir))return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,e.name);
              if(e.isDirectory())walk(p,kind);
              else if(e.isFile()&&(kind==='web'?/\.(?:js|mjs)$/.test(p):/\.ts$/.test(p))){
                const s=fs.readFileSync(p,'utf8');
                if(kind==='web'){
                  const direct=/\.observe\s*\(\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,1200}?childList\s*:\s*true/gs;
                  const fallback=/\.observe\s*\(\s*[^,;]{0,220}\|\|\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,1200}?childList\s*:\s*true/gs;
                  if(direct.test(s)||fallback.test(s))observers.push(p);
                }
                const re=/setInterval\s*\([\s\S]{0,700}?,\s*(\d{1,7})\s*\)/g;
                let m;while((m=re.exec(s))){
                  const ms=Number(m[1]),line=s.slice(0,m.index).split(/\n/).length,entry=`${p}:${line}: ${ms}ms`;
                  if(kind==='web'){intervals.push(entry);if(ms<3000)fast.push(entry)}else serverIntervals.push(entry);
                }
              }
            }
          }
          walk('web','web');walk('supabase/functions','server');
          fs.writeFileSync('cloudsales-global-observers.txt',observers.join('\n')+(observers.length?'\n':''));
          fs.writeFileSync('cloudsales-intervals.txt',intervals.join('\n')+(intervals.length?'\n':''));
          fs.writeFileSync('cloudsales-fast-polling.txt',fast.join('\n')+(fast.length?'\n':''));
          fs.writeFileSync('cloudsales-server-intervals.txt',serverIntervals.join('\n')+(serverIntervals.length?'\n':''));
          NODE

      - name: Upload runtime audit
        uses: actions/upload-artifact@v4
        with:
          name: cloudsales-runtime-audit
          path: |
            cloudsales-global-observers.txt
            cloudsales-intervals.txt
            cloudsales-fast-polling.txt
            cloudsales-server-intervals.txt
          if-no-files-found: error
          retention-days: 2

      - name: Reject runtime regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -s cloudsales-global-observers.txt
          test ! -s cloudsales-fast-polling.txt
          test ! -s cloudsales-server-intervals.txt

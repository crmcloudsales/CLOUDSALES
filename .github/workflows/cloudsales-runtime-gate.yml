name: CloudSales Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudsales-runtime-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - '.github/workflows/cloudsales-runtime-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check CloudSales browser and Worker syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find web -type f \( -name '*.js' -o -name '*.mjs' \) -print0)

      - name: Check CloudSales JSON assets
        shell: bash
        run: |
          set -Eeuo pipefail
          while IFS= read -r -d '' file; do
            node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$file"
          done < <(find web -type f -name '*.json' -print0)

      - name: Check CloudSales runtime invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs');
          const must=(file,items)=>{const s=fs.readFileSync(file,'utf8');for(const x of items)if(!s.includes(x))throw new Error(`${file}_missing_${x}`);return s};
          for(const p of ['web/assets/cloudsales-app-icon-official-v2.png','web/assets/cloudsales-app-icon-official-v2-192.png','web/assets/cloudsales-logo-official-v2.png'])
            if(!fs.existsSync(p)||fs.statSync(p).size<1000)throw new Error('missing_official_asset_'+p);

          const manifest=JSON.parse(fs.readFileSync('web/manifest.webmanifest','utf8'));
          if(manifest.id!=='/cloudsales-app-v2')throw new Error('manifest_identity_not_rotated');
          const icons=(manifest.icons||[]).map(x=>String(x.src||''));
          if(!icons.some(x=>x.includes('/cloudsales-app-icon-official-v2-192.png'))||!icons.some(x=>x.includes('/cloudsales-app-icon-official-v2.png'))||icons.some(x=>/icon\.svg/i.test(x)))throw new Error('manifest_icon_identity_invalid');

          must('web/install.js',['beforeinstallprompt','/cloudsales-app-icon-official-v2.png','promptInstall']);
          must('web/auth-runtime-v2.js',['claim-organization','cs_pending_claim','claimPending','cs_org']);
          must('web/app-runtime-v14.js',['Operational Center','tenant-ops-api','renderMarketingOps','opportunity.move']);
          const cloudy=must('web/cloudy-runtime-v3.js',['MediaRecorder','getUserMedia','requestAnimationFrame','cloudy-voice?mode=transcribe','cloudy-voice?mode=tts','SILENCE_MS','cs_cloudy_session']);
          if(cloudy.includes('SpeechRecognition')||cloudy.includes('webkitSpeechRecognition')||/setInterval\s*\(/.test(cloudy))throw new Error('cloudy_voice_runtime_regression');
          must('supabase/functions/cloudy-chat/index.ts',['organization_id: organizationId','Continue the user\'s conversation','nvidia-nim']);
          const orch=must('supabase/functions/cloudy-orchestrator/index.ts',['VIEWER_CORE','write_capable !== true','cloudy_messages','ai_route_models','tool_calls','Continue the conversation naturally']);
          if(orch.includes('Canonical production source is synchronized'))throw new Error('cloudy_orchestrator_placeholder_present');
          must('supabase/functions/cloudy-voice/index.ts',['@cf/openai/whisper','@cf/myshell-ai/melotts','mode==="transcribe"','mode==="tts"','organization_members']);

          must('web/works-runtime-v1.js',['Works · Trabajos','works.snapshot','Cloudy estuvo','Media spend','US$']);
          must('supabase/functions/workspace-api/index.ts',['works.snapshot','work_catalog','work_ledger','month_usd','Media spend is billed directly']);
          must('supabase/migrations/20260829151500_cloudsales_works_and_multi_inventory_campaigns.sql',['marketing_campaign_inventory_items','cross_tenant_campaign_inventory_link_blocked','service_post_work','brochure.send','0.65']);

          const meta=must('web/meta-runtime-v1.js',['Meta Ads','ads.meta.platform_status','ads.meta.accounts','ads.meta.sync','ads.meta.pause','ads.meta.resume','ads.meta.budget','ads.meta.create_campaign',"META_PROVIDER='meta_ads'","META_FN='cloudflare-pwa-release-v10'"]);
          const metaCmd=must('supabase/functions/meta-ads-command/index.ts',['const PROVIDER="meta_ads"','service_read_secret','meta_daily_budget_confirmation_failed','meta_campaign_status_confirmation_failed','payment_card_data_not_allowed','owner_or_admin_required']);
          must('supabase/migrations/20260829215500_meta_ads_oauth_separation.sql',['meta_ads','ads_read','ads_management','never_collect_card_data_in_cloudsales']);
          const google=must('supabase/functions/google-ads-command/index.ts',['VERSION="v25"','customers:listAccessibleCustomers','developer-token','login-customer-id','googleAds:search','campaignBudgets:mutate','campaigns:mutate','payment_card_data_not_allowed','owner_or_admin_required','google_daily_budget_confirmation_failed']);
          if(!google.includes('status:"PAUSED"'))throw new Error('google_campaign_create_must_be_paused');
          must('supabase/functions/connection-start-v4/index.ts',['https://accounts.google.com/o/oauth2/v2/auth','https://www.googleapis.com/auth/adwords','google_ads_developer_token']);
          must('supabase/functions/connection-complete-v4/index.ts',['https://oauth2.googleapis.com/token','customers:listAccessibleCustomers','google_ads_developer_token','refresh_token','connection_secrets']);
          const adspend=must('web/ad-spend-runtime-v1.js',['Ad Spend & Billing','ads.google.sync','ads.google.resume','ads.google.budget','ads.google.create_campaign','CloudSales no recibe ni almacena']);
          if(/<input[^>]+(?:card|pan|cvc|cvv|expir|security.?code)/i.test(adspend)||/\b(?:card_number|cardNumber|pan|cvc|cvv|expiry|expiration|security_code)\b\s*:/i.test(adspend))throw new Error('ad_spend_ui_must_not_collect_payment_card_data');

          must('supabase/functions/claim-organization/index.ts',['organization_owner_already_assigned','requestedRole','admin','operator']);
          const sw=must('web/sw.js',['/cloudy-runtime-v3.js','/works-runtime-v1.js','/meta-runtime-v1.js','/ad-spend-runtime-v1.js']);
          if(!/^const CACHE=['"]cloudsales-pwa-[^'"]+['"];?/m.test(sw))throw new Error('pwa_cache_version_missing');
          const pwa=must('supabase/functions/cloudflare-pwa-brand-release/index.ts',['meta_ads_runtime','ad_spend_runtime_loaded','cloudy_conversation_runtime','works_runtime_loaded','source_commit','exact_logo_bytes']);
          if(!/cloudsales-pwa-v\d+/.test(pwa))throw new Error('pwa_release_service_missing');
          const site=must('supabase/functions/cloudflare-site-brand-release/index.ts',['cloudsales-logo-official-v2.png','cloudsales-favicon-official-v2.png','all_commercial_routes_branded','exact_logo_bytes']);
          if(!/cloudsales-site-v\d+/.test(site))throw new Error('site_release_service_missing');
          console.log('CloudSales runtime invariants OK');
          NODE

      - name: Build runtime freeze and polling audit
        shell: bash
        run: |
          set -Eeuo pipefail
          node <<'NODE'
          const fs=require('fs'),path=require('path');
          const observers=[],intervals=[],fast=[],serverIntervals=[];
          function walk(dir,kind){
            if(!fs.existsSync(dir))return;
            for(const e of fs.readdirSync(dir,{withFileTypes:true})){
              const p=path.join(dir,e.name);
              if(e.isDirectory())walk(p,kind);
              else if(e.isFile()&&(kind==='web'?/\.(?:js|mjs)$/.test(p):/\.ts$/.test(p))){
                const s=fs.readFileSync(p,'utf8');
                if(kind==='web'){
                  const direct=/\.observe\s*\(\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,1200}?childList\s*:\s*true/gs;
                  const fallback=/\.observe\s*\(\s*[^,;]{0,220}\|\|\s*(?:document\.body|document\.documentElement)\s*,\s*\{[^}]{0,1200}?childList\s*:\s*true/gs;
                  if(direct.test(s)||fallback.test(s))observers.push(p);
                }
                const re=/setInterval\s*\([\s\S]{0,700}?,\s*(\d{1,7})\s*\)/g;let m;
                while((m=re.exec(s))){const ms=Number(m[1]),line=s.slice(0,m.index).split(/\n/).length,entry=`${p}:${line}: ${ms}ms`;if(kind==='web'){intervals.push(entry);if(ms<3000)fast.push(entry)}else serverIntervals.push(entry)}
              }
            }
          }
          walk('web','web');walk('supabase/functions','server');
          fs.writeFileSync('cloudsales-global-observers.txt',observers.join('\n')+(observers.length?'\n':''));
          fs.writeFileSync('cloudsales-intervals.txt',intervals.join('\n')+(intervals.length?'\n':''));
          fs.writeFileSync('cloudsales-fast-polling.txt',fast.join('\n')+(fast.length?'\n':''));
          fs.writeFileSync('cloudsales-server-intervals.txt',serverIntervals.join('\n')+(serverIntervals.length?'\n':''));
          for(const x of observers)console.log('Unsafe global childList MutationObserver:',x);
          for(const x of fast)console.log('High-frequency setInterval:',x);
          for(const x of serverIntervals)console.log('Persistent timer in Supabase Edge Function:',x);
          NODE

      - name: Upload CloudSales runtime audit
        uses: actions/upload-artifact@v4
        with:
          name: cloudsales-runtime-audit
          path: |
            cloudsales-global-observers.txt
            cloudsales-intervals.txt
            cloudsales-fast-polling.txt
            cloudsales-server-intervals.txt
          if-no-files-found: error
          retention-days: 2

      - name: Reject runtime regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -s cloudsales-global-observers.txt
          test ! -s cloudsales-fast-polling.txt
          test ! -s cloudsales-server-intervals.txt

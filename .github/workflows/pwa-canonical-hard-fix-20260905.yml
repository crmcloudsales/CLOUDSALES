name: PWA canonical hard fix 2026-09-05
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply canonical mobile UX repair
        run: python scripts/mobile_ux_hotfix_20260905.py
      - name: Commit source-of-truth fix
        run: |
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web/commercial.html web/native-shell-runtime-v1.js web/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(mobile): native viewport and working hamburger"
          git push origin HEAD:main

name: PWA canonical hard fix 2026-09-05
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pwa-canonical-hard-fix-20260905.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Canonicalize mobile PWA source of truth
        run: |
          python <<'PY'
          from pathlib import Path
          p=Path('web/native-shell-runtime-v1.js')
          s=p.read_text()
          # New shell identity so obsolete injected styles are removed.
          s=s.replace("const ID='cs-native-shell-v5';","const ID='cs-native-shell-v7';")
          # Add Office / business icon.
          old="const ICONS={\n home:'<svg viewBox=\"0 0 24 24\"><path d=\"M3.5 10.5 12 3.7l8.5 6.8v9.2H14v-5.5h-4v5.5H3.5z\"/></svg>',"
          new="const ICONS={\n office:'<svg viewBox=\"0 0 24 24\"><rect x=\"3.5\" y=\"7.5\" width=\"17\" height=\"12\" rx=\"2\"/><path d=\"M8 7.5V5.8A2.3 2.3 0 0 1 10.3 3.5h3.4A2.3 2.3 0 0 1 16 5.8v1.7M3.5 12h17M10 12v2h4v-2\"/></svg>',\n home:'<svg viewBox=\"0 0 24 24\"><path d=\"M3.5 10.5 12 3.7l8.5 6.8v9.2H14v-5.5h-4v5.5H3.5z\"/></svg>',"
          if old not in s: raise SystemExit('ICONS anchor missing')
          s=s.replace(old,new,1)
          # Fix Cloudy crop at the source: materially less zoom and face raised/centered.
          s=s.replace("background-size:295%;background-position:50% 7%;","background-size:190%;background-position:50% 38%;")
          # Replace nav functions as a block.
          a=s.index('function ensureNav()')
          b=s.index('function currentPage()',a)
          c=s.index('\n',b)
          block=r'''function ensureNav(){let nav=document.getElementById('csNativeBottom');if(!nav){nav=document.createElement('nav');nav.id='csNativeBottom';nav.className='csNBottom';nav.setAttribute('aria-label','CloudSales');document.body.appendChild(nav)}nav.innerHTML=`<button data-csn="home" aria-label="Office">${icon('office')}<small>Office</small></button><button data-csn="pipeline" aria-label="Pipeline">${icon('pipeline')}<small>Pipeline</small></button><button class="csNCloudy" data-csn="cloudy" aria-label="Hablar con Cloudy"><span class="csCloudyHead"></span><small>Cloudy</small></button><button data-csn="inbox" aria-label="IA Chat">${icon('chat')}<small>IA Chat</small></button><button data-csn="marketing" aria-label="Marketing">${icon('marketing')}<small>Marketing</small></button>`;nav.querySelectorAll('[data-csn]').forEach(b=>b.addEventListener('click',()=>{const x=b.dataset.csn;if(x==='cloudy')activateCloudyVoice();else route(x)}));ensureMoreButton();return nav}
function ensureMoreButton(){let b=document.getElementById('csNativeMoreButton');if(!b){b=document.createElement('button');b.id='csNativeMoreButton';b.className='csNMoreFloat';b.type='button';b.setAttribute('aria-label','Más');b.innerHTML=icon('more');b.onclick=openMore;document.body.appendChild(b)}return b}
function ensureMore(){let x=document.getElementById('csNativeMore');if(x)return x;x=document.createElement('div');x.id='csNativeMore';x.className='csNMore';x.innerHTML=`<div class="csNMoreCard" role="dialog" aria-modal="true" aria-label="Más"><div class="csNMoreTop"><h3>Lo que necesitas menos seguido.</h3><button class="csNClose" aria-label="Cerrar">×</button></div><div class="csNMoreGrid"><button data-go="leads">${icon('leads')}Leads</button><button data-go="pipeline">${icon('pipeline')}Pipeline</button><button data-go="inventory">${icon('inventory')}Inventory</button><button data-go="calendar">${icon('calendar')}Calendar</button><button data-go="files">${icon('files')}Files</button><button data-go="team">${icon('leads')}Team</button><button data-go="connect">${icon('connect')}Connect</button><button data-go="billing">${icon('billing')}Billing</button></div></div>`;document.body.appendChild(x);x.querySelector('.csNClose').onclick=closeMore;x.addEventListener('click',e=>{if(e.target===x)closeMore()});x.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>route(b.dataset.go));return x}
function openMore(){ensureMore().classList.add('open');document.getElementById('csNativeMoreButton')?.classList.add('active')}
function closeMore(){document.getElementById('csNativeMore')?.classList.remove('open');document.getElementById('csNativeMoreButton')?.classList.remove('active')}
function setNav(page){document.querySelectorAll('#csNativeBottom [data-csn]').forEach(b=>b.classList.toggle('active',b.dataset.csn===page))}
function currentPage(){return document.querySelector('.page.active')?.id?.replace(/^page-/,'')||'home'}'''
          s=s[:a]+block+s[c:]
          # Home is Office in user-facing shell.
          s=s.replace('<h2>Home</h2><p>Lo que importa hoy. Cloudy se encarga del resto.</p>','<h2>Office</h2><p>Lo que importa hoy. Cloudy se encarga del resto.</p>')
          # Never route CTA to a Cloudy page; speak/listen instead.
          s=s.replace("p.querySelector('[data-q=\"cloudy\"]')?.addEventListener('click',()=>route('cloudy'))","p.querySelector('[data-q=\"cloudy\"]')?.addEventListener('click',activateCloudyVoice)")
          s=s.replace("p.querySelector('[data-open=\"cloudy\"]')?.addEventListener('click',()=>route('cloudy'))","p.querySelector('[data-open=\"cloudy\"]')?.addEventListener('click',activateCloudyVoice)")
          # Inject hard auth gate + voice-first controller before boot().
          anchor='function boot(){'
          if anchor not in s: raise SystemExit('boot anchor missing')
          extra=r'''
function firstName(){const n=state?.user?.full_name||state?.user?.name||'';return String(n).trim().split(/\s+/)[0]||''}
function speakCloudy(text){return new Promise(resolve=>{try{if(!('speechSynthesis'in window)){resolve();return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='es-MX';const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/es[-_]?MX/i.test(v.lang)&&/male|jorge|raul|diego|carlos/i.test(v.name))||vs.find(v=>/^es/i.test(v.lang))||null;u.rate=.98;u.pitch=.94;u.onend=resolve;u.onerror=resolve;speechSynthesis.speak(u)}catch{resolve()}})}
function routeFromVoice(t){const q=String(t||'').toLowerCase();if(/pipeline|oportunidad|venta/.test(q))return'pipeline';if(/chat|mensaje|conversaci/.test(q))return'inbox';if(/marketing|campañ|publicidad|contenido/.test(q))return'marketing';if(/lead|prospect/.test(q))return'leads';if(/cita|agenda|calendar/.test(q))return'calendar';if(/conecta|integr|whatsapp|crm/.test(q))return'connect';if(/archivo|file|document/.test(q))return'files';return'home'}
async function activateCloudyVoice(){const who=firstName();await speakCloudy(`Hola${who?', '+who:''}. ¿Qué tal? ¿Cómo estás? ¿En qué te puedo ayudar?`);const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){await speakCloudy('En este dispositivo necesito permiso de reconocimiento de voz. Puedes seguir usando los controles mientras lo habilitamos.');return}const r=new R();r.lang='es-MX';r.interimResults=false;r.continuous=false;r.onresult=async e=>{const text=e.results?.[0]?.[0]?.transcript||'';const target=routeFromVoice(text);if(target)route(target);try{if(typeof api==='function'&&currentOrg?.id){const d=await api('cloudy-chat',{organization_id:currentOrg.id,message:text,locale:'es',session_id:typeof cloudySession!=='undefined'?cloudySession:null});if(d?.reply)await speakCloudy(d.reply)}}catch{await speakCloudy('Entendido. Ya estoy revisándolo contigo.')}};r.onerror=()=>{};try{r.start()}catch{}}
async function hardAuthGate(){try{if(typeof session==='undefined'||!session?.access_token){try{typeof clearSession==='function'&&clearSession()}catch{};try{typeof showAuth==='function'&&showAuth()}catch{};return false}const resp=await fetch('https://fkahaqprzgcimgyathqx.supabase.co/auth/v1/user',{headers:{Authorization:'Bearer '+session.access_token,apikey:(typeof ANON!=='undefined'?ANON:'')}});if(!resp.ok){try{typeof clearSession==='function'&&clearSession()}catch{};try{typeof showAuth==='function'&&showAuth()}catch{};return false}return true}catch{try{typeof clearSession==='function'&&clearSession()}catch{};try{typeof showAuth==='function'&&showAuth()}catch{};return false}}
function enforceCanonicalTypography(){document.querySelectorAll('body *').forEach(el=>{if(el.closest('svg')||['SCRIPT','STYLE','SVG','PATH'].includes(el.tagName))return;const has=[...el.childNodes].some(n=>n.nodeType===3&&String(n.textContent||'').trim());if(!has)return;const fs=parseFloat(getComputedStyle(el).fontSize||'0');if(fs>0&&fs<13)el.style.setProperty('font-size','13px','important')});document.querySelectorAll('.csRuntimeBadge,[class*=version i],[id*=version i]').forEach(el=>{if(/version|build|release|runtime/i.test((el.textContent||'')+' '+el.id+' '+el.className))el.style.display='none'})}
'''
          s=s.replace(anchor,extra+anchor,1)
          # Harden boot: don't build private shell until token is server-valid.
          s=s.replace("function boot(){css();document.documentElement.classList.add('cs-native-app');ensureNav();", "async function boot(){css();document.documentElement.classList.add('cs-native-app');if(!(await hardAuthGate()))return;ensureNav();")
          s=s.replace("window.csNativeRoute=route;", "enforceCanonicalTypography();new MutationObserver(()=>enforceCanonicalTypography()).observe(document.body,{childList:true,subtree:true});window.csNativeRoute=route;window.csCloudyVoiceActivate=activateCloudyVoice;")
          # Replace mobile clipping rules via appended authoritative CSS.
          insert="""
/* Canonical mobile shell 2026-09-05 */
@media(max-width:860px){
html.cs-native-app,html.cs-native-app body{height:auto!important;max-height:none!important;overflow-x:hidden!important;overflow-y:auto!important}
html.cs-native-app .shell:not(.hidden){height:auto!important;max-height:none!important;min-height:100dvh!important;overflow:visible!important;padding-bottom:104px!important}
html.cs-native-app .content{height:auto!important;max-height:none!important;min-height:calc(100dvh - 170px)!important;overflow:visible!important}
html.cs-native-app .page,html.cs-native-app .page.active{height:auto!important;max-height:none!important;min-height:0!important;overflow:visible!important;padding-bottom:24px!important}
.csNBottom{left:18px!important;right:18px!important;grid-template-columns:1fr 1fr 1.18fr 1fr 1fr!important;height:78px!important;padding:8px!important;overflow:visible!important}
.csNBottom button,.csNBottom small{font-size:13px!important}
.csNBottom .csNCloudy{height:68px!important;width:68px!important;transform:translateY(-13px)!important}
.csNCloudy .csCloudyHead{width:60px!important;height:60px!important;background-size:190%!important;background-position:50% 38%!important}
.csNCloudy small{top:66px!important;font-size:13px!important}
.csNMoreFloat{position:fixed;z-index:10055;right:21px;bottom:calc(86px + env(safe-area-inset-bottom));width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid #37323F;background:#121019;color:#AAA7B2;box-shadow:0 8px 24px #0008}
.csNMoreFloat .csNIcon,.csNMoreFloat svg{width:18px;height:18px}
.csNMoreGrid button,.csNMoreTop,.csNMoreTop button,.csNHeader p,.csNBadge,.csNTabs button,.csNHero p,.csNQuick button,.csNKpi span,.csNRow b,.csNRow p,.csNMeta,.csNEmpty,.csNBtn,.csNInventoryToolbar input{font-size:13px!important}
.csNPane{overflow:visible!important;max-height:none!important}
.brandrow img,.topbar img[src*=cloudsales-logo]{transform:scale(.94);transform-origin:left center}
.orgswitch,.orgswitch select{margin-left:3px}
}
"""
          s=s.replace('`;document.head.appendChild(s)}',insert+'`;document.head.appendChild(s)}',1)
          p.write_text(s)

          # PWA cache/source cleanup: retire override runtime and force a new worker namespace.
          h=Path('web/pwa.html'); t=h.read_text()
          import re
          t=re.sub(r'<script src="/canonical-pwa-runtime-v1\.js[^>]*></script>','',t)
          h.write_text(t)
          sw=Path('web/sw.js'); w=sw.read_text();w=re.sub(r"const CACHE='[^']+';","const CACHE='cloudsales-pwa-2026.09.05.1-canonical-hard-fix';",w,1);sw.write_text(w)
          PY
      - name: Static canonical assertions
        run: |
          python <<'PY'
          from pathlib import Path
          s=Path('web/native-shell-runtime-v1.js').read_text()
          checks={
            'nav': 'Office</small></button><button data-csn="pipeline"' in s and 'data-csn="marketing"' in s,
            'more_float': 'csNativeMoreButton' in s and 'csNMoreFloat' in s,
            'voice': 'activateCloudyVoice' in s and "route('cloudy')" not in s[s.find('function ensureNav()'):s.find('function currentPage()')],
            'auth': 'hardAuthGate' in s and '/auth/v1/user' in s,
            'face': 'background-size:190%;background-position:50% 38%;' in s,
            'min13': 'enforceCanonicalTypography' in s,
            'scroll': 'overflow-y:auto!important' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('canonical assertions failed: '+','.join(bad))
          print('CANONICAL_SOURCE_PASS',checks)
          PY
      - name: Commit source-of-truth fix
        run: |
          git config user.name crmcloudsales
          git config user.email crmcloudsales@gmail.com
          git add web/native-shell-runtime-v1.js web/pwa.html web/sw.js
          git diff --cached --quiet && exit 0
          git commit -m "fix(pwa): canonical Office nav voice auth and no clipping"
          git push

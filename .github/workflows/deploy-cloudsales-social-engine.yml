name: Deploy CloudSales Social Engine

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/integration-catalog/**'
      - 'supabase/functions/_shared/social-contract.ts'
      - 'supabase/functions/admin-secrets-setup/**'
      - '.github/workflows/deploy-cloudsales-social-engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudsales-social-engine-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify deployment credential exists
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'SUPABASE_ACCESS_TOKEN repository secret is not configured'; exit 1; }

      - name: Deploy integration-catalog
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy integration-catalog --project-ref fkahaqprzgcimgyathqx

      - name: Deploy admin-secrets-setup
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy admin-secrets-setup --project-ref fkahaqprzgcimgyathqx

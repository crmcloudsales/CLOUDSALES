name: CloudSales Commercial Canonical Guard

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - 'config/**'
      - '.github/scripts/remove-free-trials-20260905.py'
      - '.github/workflows/finalize-cloudsales-commercial-20260903.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript syntax
        run: |
          node --check web/cloudsales-i18n-v1.js
          node --check web/commercial-brand-runtime-v2.js
          node --check web/commercial-sales-story-v1.js
          node --check web/commercial-crm-bmp-v3.js
      - name: Enforce paid-from-day-one policy
        run: |
          if grep -REni --include='*.html' --include='*.js' --include='*.ts' --include='*.json' '(free[[:space:]-]+trial|prueba[[:space:]]+(gratis|gratuita)|trial_days|trial_period_days|trial_ends_at|trial_started_at|trialing|auto_charge_after_trial)' web supabase/functions config; then
            echo 'ERROR: free-access-period configuration or copy exists in active CloudSales sources'
            exit 1
          fi
          echo 'PAID_FROM_DAY_ONE_VERIFIED'
      - name: Verify canonical pricing truth
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('web/commercial.html').read_text(encoding='utf-8')
          assert '$47 USD / mes' in h
          assert '$97 USD / mes' in h
          assert '$147 USD / mes' in h
          assert 'Premium $147/mes · Incluye 2 usuarios' in h
          print('CANONICAL_PRICING_VERIFIED')
          PY

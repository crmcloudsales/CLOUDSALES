name: Retry CloudSales Arabic i18n 2026-09-03
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/retry-arabic-i18n-20260903.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: cloudsales-arabic-i18n-final
  cancel-in-progress: true
jobs:
  arabic:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harden builder and fix Arabic numeric preservation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/build_i18n_catalog_locale_20260903.mjs')
          s=p.read_text()

          old="function numbers(s){return [...s.matchAll(/(?:[$€£¥]\\s*)?\\d+(?:[.,]\\d+)?\\s*%?/g)].map(m=>m[0].replace(/\\s+/g,'')).sort()}\nfunction validatePreservation(source,target){const a=numbers(source),b=numbers(target);if(JSON.stringify(a)!==JSON.stringify(b))throw new Error('numeric_preservation_failed: '+source.slice(0,80)+' => '+target.slice(0,80));for(const brand of ['CloudSales','Cloudy','AgentCloud','CloudCo','LISTIA','Stripe','PayPal','Binance'])if(source.includes(brand)&&!target.includes(brand))throw new Error('brand_preservation_failed_'+brand)}"
          new="function protectedNumbers(s){const out=[];for(const m of s.matchAll(/[$€£¥]?\\s*\\d+(?:[.,]\\d+)?\\s*(?:%|USD|MXN|EUR|GBP|AED)?/gi)){const raw=m[0].replace(/\\s+/g,''),num=(raw.match(/\\d+(?:[.,]\\d+)?/)||[])[0];if(!num)continue;const v=Number(num.replace(',','.'));if(/[$€£¥%]|USD|MXN|EUR|GBP|AED/i.test(raw)||num.includes('.')||num.includes(',')||v>=10)out.push(num.replace(',','.'))}return out.sort()}\nfunction validatePreservation(source,target){const a=protectedNumbers(source),b=protectedNumbers(target);for(const n of a)if(!b.includes(n))throw new Error('protected_numeric_missing: '+source.slice(0,100)+' => '+target.slice(0,100));for(const term of ['CloudSales','Cloudy','AgentCloud','CloudCo','LISTIA','Stripe','PayPal','Binance','USD','MXN','EUR','GBP','AED'])if(source.includes(term)&&!target.includes(term))throw new Error('protected_term_missing_'+term);for(const m of source.matchAll(/https?:\\/\\/[^\\s<>'\\\"]+/g))if(!target.includes(m[0]))throw new Error('url_preservation_failed')}"
          if old not in s: raise SystemExit('numeric validator marker not found')
          s=s.replace(old,new,1)

          old_oidc="let oidc={token:'',at:0};async function oidcToken(){if(oidc.token&&Date.now()-oidc.at<240000)return oidc.token;const base=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,req=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;if(!base||!req)throw new Error('github_oidc_unavailable');const u=new URL(base);u.searchParams.set('audience','cloudsales-i18n-build');const r=await fetch(u,{headers:{Authorization:'Bearer '+req}});if(!r.ok)throw new Error('oidc_'+r.status);const j=await r.json();oidc={token:j.value,at:Date.now()};return oidc.token}"
          new_oidc="let oidc={token:'',at:0};async function oidcToken(){if(oidc.token&&Date.now()-oidc.at<210000)return oidc.token;const base=process.env.ACTIONS_ID_TOKEN_REQUEST_URL,req=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;if(!base||!req)throw new Error('github_oidc_unavailable');let last='oidc_unavailable';for(let attempt=1;attempt<=7;attempt++){try{const u=new URL(base);u.searchParams.set('audience','cloudsales-i18n-build');const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),18000);let r;try{r=await fetch(u,{headers:{Authorization:'Bearer '+req},signal:ctl.signal})}finally{clearTimeout(timer)}if(r.ok){const j=await r.json();if(j?.value){oidc={token:j.value,at:Date.now()};return oidc.token}}last='oidc_'+r.status}catch(e){last='oidc_'+String(e?.name||e)}await new Promise(r=>setTimeout(r,800*Math.min(attempt,5)))}throw new Error(last)}"
          if old_oidc in s:s=s.replace(old_oidc,new_oidc,1)

          s=s.replace("async function translateBatch(items,surface,depth=0){if(!items.length)return{};const token=await oidcToken();const system=", "async function translateBatch(items,surface,depth=0){if(!items.length)return{};const system=",1)
          old_fetch="for(let attempt=1;attempt<=3;attempt++)try{const r=await fetch(ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+token,'x-cloudsales-build':'i18n','content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));"
          new_fetch="for(let attempt=1;attempt<=6;attempt++)try{const token=await oidcToken();const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),105000);let r;try{r=await fetch(ENDPOINT,{method:'POST',headers:{Authorization:'Bearer '+token,'x-cloudsales-build':'i18n','content-type':'application/json'},body:JSON.stringify(body),signal:ctl.signal})}finally{clearTimeout(timer)}const j=await r.json().catch(()=>({}));"
          if old_fetch in s:s=s.replace(old_fetch,new_fetch,1)
          old_parse="const obj=parseJson(j?.choices?.[0]?.message?.content||'');const tr=obj?.translations;if(!tr||typeof tr!=='object')throw new Error('invalid_json_shape');"
          new_parse="const raw=String(j?.choices?.[0]?.message?.content||'').trim();let tr=null;try{const obj=parseJson(raw);tr=obj?.translations}catch{}if((!tr||typeof tr!=='object')&&items.length===1&&raw){let plain=raw.replace(/^```(?:json)?\\s*/i,'').replace(/\\s*```$/,'').trim();if(!plain.startsWith('{')){plain=plain.replace(/^['\\\"]|['\\\"]$/g,'').trim();if(plain)tr={[items[0].id]:plain}}}if(!tr||typeof tr!=='object')throw new Error('invalid_json_shape');"
          if old_parse in s:s=s.replace(old_parse,new_parse,1)
          old_catch="}catch(e){if(attempt===3){if(items.length>1&&depth<5){const mid=Math.ceil(items.length/2);return Object.assign({},await translateBatch(items.slice(0,mid),surface,depth+1),await translateBatch(items.slice(mid),surface,depth+1))}throw e}await new Promise(r=>setTimeout(r,700*attempt))}return{}}"
          new_catch="}catch(e){const msg=String(e?.message||e);if(msg.includes('401')||msg.startsWith('oidc_'))oidc={token:'',at:0};if(attempt===6){if(items.length>1&&depth<9){const mid=Math.ceil(items.length/2);return Object.assign({},await translateBatch(items.slice(0,mid),surface,depth+1),await translateBatch(items.slice(mid),surface,depth+1))}throw e}await new Promise(r=>setTimeout(r,900*Math.min(attempt,5)))}return{}}"
          if old_catch in s:s=s.replace(old_catch,new_catch,1)
          old_batches="function batches(items){const out=[];let cur=[],chars=0;for(const x of items){const n=x.text.length;if(cur.length&&(cur.length>=28||chars+n>11500)){out.push(cur);cur=[];chars=0}cur.push(x);chars+=n}if(cur.length)out.push(cur);return out}"
          new_batches="function batches(items){const out=[];let cur=[],chars=0;for(const x of items){const n=x.text.length;if(cur.length&&(cur.length>=18||chars+n>7000)){out.push(cur);cur=[];chars=0}cur.push(x);chars+=n}if(cur.length)out.push(cur);return out}"
          if old_batches in s:s=s.replace(old_batches,new_batches,1)
          old_surface="async function translateSurface(list,surface){const result={},pending=[];for(const text of list){if(identityForTarget(text)){result[text]=text;continue}pending.push({id:idFor(text),text})}const bs=batches(pending);console.log(locale,surface,'sources',list.length,'identity',list.length-pending.length,'batches',bs.length);let done=0;for(const batch of bs){const tr=await translateBatch(batch,surface);for(const x of batch)result[x.text]=tr[x.id];done+=batch.length;console.log(locale,surface,'translated',done,'/',pending.length)}for(const s of list)if(typeof result[s]!=='string'||!result[s].trim())throw new Error('catalog_missing_'+surface+'_'+s.slice(0,60));return Object.fromEntries(Object.entries(result).sort(([a],[b])=>a.localeCompare(b)))}"
          new_surface="async function translateSurface(list,surface){const result={},pending=[];for(const text of list){if(identityForTarget(text)){result[text]=text;continue}pending.push({id:idFor(text),text})}const bs=batches(pending);console.log(locale,surface,'sources',list.length,'identity',list.length-pending.length,'batches',bs.length);let done=0,cursor=0;async function worker(){while(true){const i=cursor++;if(i>=bs.length)return;const batch=bs[i],tr=await translateBatch(batch,surface);for(const x of batch)result[x.text]=tr[x.id];done+=batch.length;console.log(locale,surface,'translated',done,'/',pending.length)}}await Promise.all(Array.from({length:Math.min(3,bs.length)},()=>worker()));for(const s of list)if(typeof result[s]!=='string'||!result[s].trim())throw new Error('catalog_missing_'+surface+'_'+s.slice(0,60));return Object.fromEntries(Object.entries(result).sort(([a],[b])=>a.localeCompare(b)))}"
          if old_surface in s:s=s.replace(old_surface,new_surface,1)
          p.write_text(s)
          PY
      - name: Generate Arabic catalog
        env:
          LOCALE: ar-AE
        run: node .github/scripts/build_i18n_catalog_locale_20260903.mjs
      - name: Certify Arabic catalog
        run: |
          node - <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync('build/i18n/ar-AE.json','utf8'));
          if(j.locale!=='ar-AE')throw Error('locale');
          if(Object.keys(j.commercial||{}).length<1000)throw Error('commercial coverage');
          if(Object.keys(j.pwa||{}).length<650)throw Error('pwa coverage');
          const vals=[...Object.values(j.commercial),...Object.values(j.pwa)].join(' ');
          if(!/[\u0600-\u06ff]/.test(vals))throw Error('arabic script missing');
          console.log('ARABIC CERTIFIED',j.counts);
          NODE
      - name: Commit certified Arabic catalog
        run: |
          mkdir -p web/i18n/catalog-v1
          cp build/i18n/ar-AE.json web/i18n/catalog-v1/ar-AE.json
          git config user.name 'CloudSales i18n Certifier'
          git config user.email 'actions@users.noreply.github.com'
          git add web/i18n/catalog-v1/ar-AE.json
          git commit -m 'i18n: certify Arabic web and PWA catalog' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main

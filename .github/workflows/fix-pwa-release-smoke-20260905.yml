name: Fix CloudSales PWA release smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-pwa-release-smoke-20260905.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Patch PWA release smoke and digest typing
        run: python .github/scripts/fix_pwa_release_smoke_20260905.py
      - name: Type-check release function
        run: deno check supabase/functions/cloudflare-pwa-release-v12/index.ts
      - name: Commit release smoke fix
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet -- supabase/functions/cloudflare-pwa-release-v12/index.ts; then
            echo 'Already fixed.'
            exit 0
          fi
          git config user.name 'CloudSales Automation'
          git config user.email 'noreply@cloudsales.app'
          git add supabase/functions/cloudflare-pwa-release-v12/index.ts
          git commit -m 'Fix PWA release smoke for current canonical runtime'
          git push origin HEAD:main

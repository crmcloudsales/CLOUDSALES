name: CloudSales Trial14 Finalize
on:
  push:
    paths:
      - '.github/workflows/cloudsales-trial14-run.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy no-trial regression rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/cloudflare-site-brand-release/index.ts')
          s=p.read_text()
          legacy=".replace(/<li>\\s*14 días de prueba\\s*<\\/li>/gi,'').replace(/\\b14 días de prueba\\b/gi,'')"
          s=s.replace(legacy,'')
          if "replace(/\\b14 días de prueba\\b/gi,'')" in s:
              raise SystemExit('legacy trial stripping rule remains')
          p.write_text(s)
          PY
          grep -q '14 días de prueba gratis' web/commercial.html
          grep -q 'TRIAL_COPY' web/cloudsales-i18n-v1.js
          grep -q 'trialOnboardNotice' web/pwa.html
          grep -q 'TRIAL_UI_COPY' web/auth-runtime-v2.js
          node --check web/cloudsales-i18n-v1.js
          node --check web/auth-runtime-v2.js
      - name: Remove one-time trial tooling
        run: |
          rm -f .github/workflows/cloudsales-trial-14-sync-once.yml
          rm -f .github/scripts/apply_cloudsales_trial14.py
          rm -f .github/workflows/cloudsales-trial14-run.yml
      - name: Commit final canonical state
        run: |
          git config user.name "crmcloudsales"
          git config user.email "crmcloudsales@gmail.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(trial): preserve 14-day free trial across future CloudSales releases"
          git push origin HEAD:main

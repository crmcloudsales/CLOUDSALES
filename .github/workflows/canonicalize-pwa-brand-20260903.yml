name: Canonicalize CloudSales PWA Brand 2026-09-03
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/canonicalize_pwa_brand_20260903.py'
      - '.github/workflows/canonicalize-pwa-brand-20260903.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloudsales-pwa-canonical-brand-20260903
  cancel-in-progress: true
jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply canonical PWA brand
        run: python3 .github/scripts/canonicalize_pwa_brand_20260903.py
      - name: Validate canonical visual source
        run: |
          grep -Fq 'cs-pwa-brand-canonical-20260903' web/pwa.html
          grep -Fq '<meta name="theme-color" content="#08070D">' web/pwa.html
          grep -Fq '<meta name="color-scheme" content="light dark">' web/pwa.html
          grep -Fq -- '--bg:#08070D!important' web/pwa.html
          grep -Fq -- '--panel:#121019!important' web/pwa.html
          grep -Fq -- '--p2:#17141F!important' web/pwa.html
          grep -Fq -- '--text:#F3F4F8!important' web/pwa.html
          grep -Fq -- '--pink:#F955B6!important' web/pwa.html
          grep -Fq -- '--vio:#C13BE4!important' web/pwa.html
          grep -Fq 'linear-gradient(135deg,#F955B6 0%,#ED4FC3 46%,#C13BE4 100%)' web/pwa.html
          grep -Fq 'const VERSION="2026.09.03.2";' supabase/functions/cloudflare-pwa-brand-release/index.ts
          ! grep -Fq '<meta name="theme-color" content="#08080f"<meta' web/pwa.html
          ! grep -Eqi '#8d5cff|#8d47ff|#bd2cff|#ff2b9b' web/pwa.html
      - name: Commit canonical PWA brand
        run: |
          git config user.name 'CloudSales Brand Lock'
          git config user.email 'actions@users.noreply.github.com'
          git add web/pwa.html web/install.js web/native-shell-runtime-v1.js web/pwa-polish-runtime-v1.js web/workspace-polish-runtime-v1.js web/dashboard-runtime-v3.js web/sales-analytics-runtime-v1.js web/contact-profile-runtime-v1.js web/ai-chat-runtime-v2.js web/calendar-runtime-v1.js web/meta-runtime-v1.js web/app-runtime-v14.js web/cloudy-runtime-v3.js web/works-runtime-v1.js web/ad-spend-runtime-v1.js web/cloudy-executive-runtime-v1.js supabase/functions/cloudflare-pwa-brand-release/index.ts
          if git diff --cached --quiet; then echo 'Canonical PWA brand already current'; exit 0; fi
          git commit -m 'fix(pwa): enforce canonical CloudSales visual system'
          git push origin HEAD:main

name: CloudSales Subscriber Onboarding Audit 2026-09-05
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudsales-subscriber-onboarding-audit-20260905.yml'
      - 'web/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium webkit >/dev/null
      - name: Run live onboarding audit
        env:
          COMMERCIAL: https://cloudsales.app
          APP: https://app.cloudsales.app
        run: |
          cat > audit.mjs <<'JS'
          import { chromium, webkit, devices } from 'playwright';
          import assert from 'node:assert/strict';
          const COMMERCIAL=process.env.COMMERCIAL, APP=process.env.APP;
          const report=[]; let failures=0;
          const ok=(n,d='')=>{report.push({name:n,status:'PASS',detail:d});console.log(`PASS ${n} ${d}`)};
          const fail=(n,d='')=>{failures++;report.push({name:n,status:'FAIL',detail:d});console.error(`FAIL ${n} ${d}`)};
          async function check(n,fn){try{await fn();ok(n)}catch(e){fail(n,String(e?.message||e))}}

          await check('commercial_http_200',async()=>{const r=await fetch(COMMERCIAL+'/?qa='+Date.now(),{headers:{'cache-control':'no-cache'}});assert.equal(r.status,200);const t=await r.text();assert.match(t,/Basic/i);assert.match(t,/Pro/i);assert.match(t,/Premium/i);assert.match(t,/Pago seguro por PayPal/i);assert.doesNotMatch(t,/Checkout seguro por Stripe/i);assert.doesNotMatch(t,/free\s*trial|prueba\s+gratuita|prueba\s+gratis/i);assert.doesNotMatch(t,/aesquer1@gmail\.com|7XCN724E73MHKXAV|arturo-pro|Senzik/i)});
          await check('manifest_dark_icons',async()=>{const r=await fetch(APP+'/manifest.webmanifest?qa='+Date.now(),{headers:{'cache-control':'no-cache'}});assert.equal(r.status,200);const m=await r.json();assert.equal(String(m.background_color).toUpperCase(),'#08070D');assert.equal(String(m.theme_color).toUpperCase(),'#08070D');const sizes=new Set((m.icons||[]).map(x=>x.sizes));assert.ok(sizes.has('192x192'));assert.ok(sizes.has('512x512'))});

          for (const [engineName,engine,contextOptions] of [['chromium',chromium,{}],['webkit_mac',webkit,{viewport:{width:1440,height:900}}],['webkit_iphone',webkit,{...devices['iPhone 15']}]] ) {
            const browser=await engine.launch({headless:true}); const context=await browser.newContext(contextOptions); const page=await context.newPage(); page.setDefaultTimeout(8000);
            await check(`${engineName}_commercial_renders`,async()=>{await page.goto(COMMERCIAL+'/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(500);const body=(await page.locator('body').innerText()).trim();assert.ok(body.length>500,'commercial body blank');assert.match(body,/Basic/i);assert.match(body,/Pro/i);assert.match(body,/Premium/i)});
            await check(`${engineName}_signup_renders_not_blank`,async()=>{await page.goto(APP+'/?signup=1&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(700);const body=(await page.locator('body').innerText()).trim();assert.ok(body.length>150,'signup page blank');assert.match(body,/Google/i);assert.match(body,/Microsoft/i);assert.ok(await page.locator('input[type="email"]').count(),'email input missing');assert.ok(await page.locator('input[type="password"]').count(),'password input missing')});
            for (const [provider,selector] of [['google','#googleAuthBtn'],['microsoft','#microsoftAuthBtn']]) {
              await check(`${engineName}_${provider}_oauth_starts`,async()=>{await page.goto(APP+'/?signup=1&qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(600);const btn=page.locator(selector);assert.equal(await btn.count(),1,`${provider} button missing`);let seen='';await page.route('**/*',async route=>{const u=route.request().url();if(/\/auth\/v1\/authorize/i.test(u)){seen=u;await route.abort()}else await route.continue()});await btn.click().catch(()=>{});await page.waitForTimeout(700);assert.match(seen,/supabase\.co\/auth\/v1\/authorize/i,`${provider} OAuth authorize request not started`);await page.unroute('**/*')});
            }
            for (const suffix of ['ios','android','desktop']) await check(`${engineName}_install_${suffix}_loads`,async()=>{const r=await page.request.get(APP+`/?install=${suffix}&qa=`+Date.now(),{timeout:15000});assert.equal(r.status(),200)});
            await browser.close();
          }

          const browser=await chromium.launch({headless:true});const page=await browser.newPage();page.setDefaultTimeout(8000);await page.goto(COMMERCIAL+'/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});await page.waitForTimeout(500);
          for (const [key,label] of [['plan_basic','basic'],['plan_pro','pro'],['plan_premium','premium']]) await check(`paypal_${label}_checkout_reusable`,async()=>{const button=page.locator(`.buy[data-item="${key}"]`);assert.ok(await button.count(),`${key} button missing`);await button.first().click();await page.waitForTimeout(150);const email=page.locator('#cemail');assert.ok(await email.count(),'checkout email missing');await email.fill(`qa+${label}-${Date.now()}@cloudsales.app`);const c=page.locator('#cstart');assert.ok(await c.count(),'continue button missing');const popupPromise=page.waitForEvent('popup',{timeout:3500}).catch(()=>null);await c.click();const popup=await popupPromise;if(popup){await popup.waitForLoadState('domcontentloaded',{timeout:5000}).catch(()=>{});const u=popup.url();assert.match(u,/paypal\.com/i,`not PayPal: ${u}`);await popup.close()}else{await page.waitForTimeout(500);const msg=(await page.locator('#cerr').innerText().catch(()=>''))||'';assert.fail(`PayPal did not open. ${msg}`)}await page.locator('#cclose').click().catch(()=>{})});
          await browser.close();
          console.log('ONBOARDING_AUDIT_COMPLETE',JSON.stringify(report));if(failures){console.error(`ONBOARDING_AUDIT_FAILURES=${failures}`);process.exit(1)}console.log('ONBOARDING_AUDIT_ALL_PASS');
          JS
          node audit.mjs
